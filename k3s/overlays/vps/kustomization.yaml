# The single-node server: the whole base, the public name (host.env) and a Let's Encrypt certificate for the edge. The real sandbox (the Go
# judge-server) is the base's own; its measured limits (task 6) are the base's starting values until they are measured on that host. See k3s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oj
resources:
  - ../../base
  - edge-certificate.yaml
  - cluster-issuer.yaml
# Per-job cgroups for the sandboxes (judge-server spec 14.4). It needs the node prepared first (k3s/README.md "Job cgroups": the slice, the admission
# config); with CGROUP_MODE auto a node that is not prepared still runs the sandbox as before, but the pod will not start without the
# slice directory (hostPath type Directory). Flip CGROUP_MODE to required in the component once a node is confirmed.
components:
  - ../../components/cgroup
  # the stack's Secrets from Vault instead of env-to-secrets.sh (k3s/README.md "Secrets in Vault"); vps-stage1 inherits it
  - ../../components/vault
configMapGenerator:
  - name: public-host
    envs: [host.env]
    options:
      disableNameSuffixHash: true
replacements:
  - source: {kind: ConfigMap, name: public-host, fieldPath: data.OJ_PUBLIC_HOST}
    targets:
      - select: {kind: Deployment, name: api-gateway}
        fieldPaths:
          - spec.template.spec.containers.[name=api-gateway].env.[name=OJ_PUBLIC_HOST].value
      - select: {kind: Certificate, name: edge-tls}
        fieldPaths: [spec.dnsNames.0]
  - source: {kind: ConfigMap, name: public-host, fieldPath: data.ACME_EMAIL}
    targets:
      - select: {kind: ClusterIssuer, name: letsencrypt}
        fieldPaths: [spec.acme.email]
# Our images, pinned by commit on the server (compose's OJ_TAG): `k3s/scripts/pin-images.sh <commit sha>` sets all seven, `main` floats them
# again. A floating tag means any push to main changes what a restarted pod runs.
images:
  - name: docker.io/thanhtuanle/oj-api-gateway
    newTag: main
  - name: docker.io/thanhtuanle/oj-identity-service
    newTag: main
  - name: docker.io/thanhtuanle/oj-problem-service
    newTag: main
  - name: docker.io/thanhtuanle/oj-submission-service
    newTag: main
  - name: docker.io/thanhtuanle/judge-worker
    newTag: main
  - name: docker.io/thanhtuanle/judge-portal
    newTag: main
  - name: docker.io/thanhtuanle/judge-server
    newTag: main
