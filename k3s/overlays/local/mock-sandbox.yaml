# The real sandbox needs the Linux host's kernel (seccomp, rlimits), and its x86_64 build is only verified on the server: locally each
# Judge Pod runs the same image with `mock`, the server's scripted API (judge-server/internal/mock; compose's docker-compose.mock.yml
# does the same). Same gRPC over the same mutual TLS, the same token, certificates, probes (`judge-server healthcheck` works against
# `mock`) and capabilities, so the workers' address stays localhost:8080 and nothing else is patched. The image is the base's
# (docker.io/thanhtuanle/judge-server:main), built by scripts/local-stack.sh build and loaded by scripts/k3d-up.sh import.
# MOCK_SLOW_SECONDS: how long a TRIGGER_SLOW source pauses (default 3; an invalid value stops the mock with exit status 2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge
spec:
  template:
    spec:
      initContainers:
        - name: sandbox
          args: ["mock"]
          env:
            - name: MOCK_SLOW_SECONDS
              value: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: run-judge
spec:
  template:
    spec:
      initContainers:
        - name: sandbox
          args: ["mock"]
          env:
            - name: MOCK_SLOW_SECONDS
              value: "3"
