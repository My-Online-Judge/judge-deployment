# k3d on a laptop: the mock sandbox, the images built by scripts/local-stack.sh and imported into the cluster, a private CA
# made for the occasion. See k3s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oj
resources:
  - ../../base
  - selfsigned-ca.yaml
  - edge-certificate.yaml
patches:
  - path: redirect-port.yaml
