# Traefik answers on the host's 443 here (scripts/k3d-up.sh): http://localhost lands on https://localhost, the origin the Google
# OAuth client allows. A cluster made with another K3D_HTTPS_PORT needs that port here too.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    port: "443"
    permanent: true
