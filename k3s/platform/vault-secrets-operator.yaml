# The Vault Secrets Operator, installed by K3s's Helm controller: it reads the stack's secrets from Vault (k3s/components/vault, the server
# overlays) and writes them as the Secrets the pods read. It needs its CRDs before an overlay that has the component is applied
# (k3s/README.md "Secrets in Vault"). Note: its ClusterRole may read and write Secrets in every namespace, as any such operator must.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: vault-secrets-operator
  namespace: kube-system
spec:
  repo: https://helm.releases.hashicorp.com
  chart: vault-secrets-operator
  version: 1.6.2
  targetNamespace: vault-secrets-operator-system
  createNamespace: true
  valuesContent: |-
    controller:
      manager:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
      kubeRbacProxy:
        resources:
          requests: {cpu: 5m, memory: 32Mi}
          limits: {memory: 128Mi}
