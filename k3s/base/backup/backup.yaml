# Generated by k3s/scripts/gen_backup.py: edit k3s/backup/*.sh (or the script), not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
data:
  drill.sh: |
    #!/bin/bash
    # The restore drill (CronJob restore-drill, container verify; the init container restic-restore has put the latest snapshot in
    # /restore): backup/restore-drill.sh for pods. Each dump is restored into a throwaway Postgres inside this container (no network,
    # no certificate, nothing of the live system) and the row counts are compared with the counts.tsv taken at backup time. Exit 0 and
    # only PASS (or INFO) lines means the backup restores.
    set -euo pipefail
    # shellcheck source=/dev/null
    source /opt/oj/backup/lib.sh
    data=/restore/staging
    [ -f "$data/counts.tsv" ] || { echo "snapshot has no counts.tsv" >&2; exit 1; }

    snap=$(stat -c %Y "$data/counts.tsv")
    echo "snapshot taken $(date -d "@$snap" '+%F %T')"
    if [ $(( $(date +%s) - snap )) -gt $(( 36 * 3600 )) ]; then
      echo "FAIL snapshot is older than 36 hours" >&2; exit 1
    fi

    pgdata=/tmp/pgdata
    initdb -D "$pgdata" -U postgres -A trust > /dev/null
    pg_ctl -D "$pgdata" -o "-c listen_addresses='' -c unix_socket_directories=/tmp" -w -l /tmp/pg.log start > /dev/null
    trap 'pg_ctl -D "$pgdata" -m immediate stop > /dev/null 2>&1 || true' EXIT

    actual=/tmp/actual.tsv
    : > "$actual"
    for svc in identity problem submission; do
      createdb -h /tmp -U postgres "drill_$svc"
      pg_restore -h /tmp -U postgres -d "drill_$svc" --no-owner --no-privileges "$data/$svc.dump"
      for pair in $BACKUP_COUNT_TABLES; do
        [ "${pair%%:*}" = "$svc" ] || continue
        tbl=${pair#*:}
        printf '%s\t%s\n' "$tbl" "$(psql -h /tmp -At -U postgres "drill_$svc" -c "select count(*) from $tbl")" >> "$actual"
      done
    done
    printf 'minio_objects\t%s\n' "$(find "$data/minio" -type f | wc -l)" >> "$actual"

    compare_counts "$data/counts.tsv" "$actual"
  dump.sh: |
    #!/bin/bash
    # Step 1 of the nightly backup (CronJob backup, container dump): the three Postgres dumps and the row counts taken just before and
    # just after each (backup/backup.sh does the same for compose; the drill accepts anything in [min, max] because the system keeps
    # writing). Connects over TLS with the certificate of the identity `backup`, as the database owner: the password of each database
    # is in the environment as <SERVICE>_POSTGRES_PASSWORD (a prefix of the Secret that service's pods use).
    set -euo pipefail
    umask 077
    # shellcheck source=/dev/null
    source /opt/oj/backup/lib.sh   # BACKUP_COUNT_TABLES, byte for byte backup/lib.sh
    staging=/staging
    mkdir -p "$staging/minio"
    : > "$staging/counts.tsv"

    conn() { # <service>: a libpq connection string, the password aside
      local up=${1^^}
      local user=${up}_POSTGRES_USER db=${up}_POSTGRES_DB
      echo "host=$1-db port=5432 dbname=${!db} user=${!user} sslmode=verify-full sslrootcert=/etc/oj/tls/ca.crt sslcert=/etc/oj/tls/tls.crt sslkey=/etc/oj/tls/tls.key"
    }
    run() { # <service> <command> [args...]: the command with that service's password and, as its last argument, its connection string
      local up=${1^^}; local pw=${up}_POSTGRES_PASSWORD
      local svc=$1; shift
      PGPASSWORD=${!pw} "$@" "$(conn "$svc")"
    }
    count() { run "$1" psql -At -c "select count(*) from $2"; }

    # A pod's first seconds: the network policies that admit it are programmed on the node a moment after it starts, so a first
    # connection can be refused. Wait for each database instead of failing the night.
    wait_for() { # <service>
      for _ in $(seq 1 30); do
        pg_isready -q -h "$1-db" -p 5432 && return 0
        sleep 2
      done
      echo "$1-db does not answer" >&2; return 1
    }

    for svc in identity problem submission; do
      wait_for "$svc"
      tables=(); before=()
      for pair in $BACKUP_COUNT_TABLES; do
        [ "${pair%%:*}" = "$svc" ] || continue
        tables+=("${pair#*:}"); before+=("$(count "$svc" "${pair#*:}")")
      done
      echo "dump $svc-db"
      run "$svc" pg_dump -Fc -f "$staging/$svc.dump"
      for i in "${!tables[@]}"; do
        after=$(count "$svc" "${tables[$i]}"); b=${before[$i]}
        lo=$(( b < after ? b : after )); hi=$(( b > after ? b : after ))
        printf '%s\t%s\t%s\n' "${tables[$i]}" "$lo" "$hi" >> "$staging/counts.tsv"
      done
    done
    echo "dumps done"
  lib.sh: |
    #!/usr/bin/env bash
    # Shared helpers for backup.sh and restore-drill.sh. Source this file; it has no side effects.

    # service:table pairs whose row counts are recorded at backup time and re-checked by the drill.
    # shellcheck disable=SC2034  # read by backup.sh and restore-drill.sh, which source this file
    BACKUP_COUNT_TABLES="identity:t_users problem:t_problems problem:t_test_cases submission:t_submissions submission:t_outbox"

    # Rows listed here are reported as INFO and never fail (they churn constantly on a live system).
    BACKUP_INFO_ROWS="t_outbox"

    # compare_counts <expected.tsv> <actual.tsv>
    # expected rows: "name<TAB>min<TAB>max" (a lone count means min=max); actual rows: "name<TAB>count".
    # Prints "PASS name n" or "FAIL name expected=min..max actual=a" (rows missing on either side fail, with an
    # empty value), or "INFO ..." for BACKUP_INFO_ROWS. Returns 1 if any row FAILs.
    compare_counts() {
      awk -F'\t' -v info="$BACKUP_INFO_ROWS" '
        BEGIN { m = split(info, a, " "); for (j = 1; j <= m; j++) isinfo[a[j]] = 1 }
        NR == FNR { lo[$1] = $2; hi[$1] = ($3 == "" ? $2 : $3); names[$1] = 1; order[++n] = $1; next }
        { got[$1] = $2; if (!($1 in names)) { names[$1] = 1; order[++n] = $1 } }
        END {
          bad = 0
          for (i = 1; i <= n; i++) {
            k = order[i]
            r = (k in lo) ? lo[k] ".." hi[k] : ""
            ok = (k in lo) && (k in got) && got[k] + 0 >= lo[k] + 0 && got[k] + 0 <= hi[k] + 0
            if (k in isinfo) print "INFO " k " expected=" r " actual=" got[k]
            else if (ok) print "PASS " k " " got[k]
            else { print "FAIL " k " expected=" r " actual=" got[k]; bad = 1 }
          }
          exit bad
        }' "$1" "$2"
    }
  mirror.sh: |
    #!/bin/bash
    # Step 2 of the nightly backup (container mirror): the test-case bucket copied into the staging directory over TLS, as MinIO's root
    # account (from the Secret minio-init), and its object count appended to counts.tsv (exact: nothing else writes to a bucket that
    # only problem-service changes, and the drill compares it with what the snapshot restores).
    set -euo pipefail
    umask 077
    export HOME=/tmp SSL_CERT_FILE=/etc/oj/tls/ca.crt
    staging=/staging
    # the network policy that admits this pod is programmed a moment after it starts: wait for MinIO instead of failing the night
    for _ in $(seq 1 30); do
      (exec 3<>/dev/tcp/minio/9000) 2> /dev/null && break
      sleep 2
    done
    echo "mirror bucket $MINIO_BUCKET"
    MC_HOST_local="https://$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD@minio:9000" mc mirror --overwrite "local/$MINIO_BUCKET" "$staging/minio"
    # the MinIO image has no find: mc lists the local copy, one line per object
    n=$(mc ls --recursive "$staging/minio" | wc -l | tr -d ' ')
    printf 'minio_objects\t%s\t%s\n' "$n" "$n" >> "$staging/counts.tsv"
    echo "mirrored $n objects"
  restic.sh: |
    #!/bin/sh
    # Step 3 of the nightly backup (container restic): the staging directory into the restic repository, then the retention of
    # backup/backup.sh. The repository is whatever the Secret `restic` says (RESTIC_REPOSITORY, RESTIC_PASSWORD and, for S3 or B2,
    # their access keys): off the cluster's disk on the server. Without both it stops, so a night is never silently skipped.
    set -eu
    if [ -z "${RESTIC_REPOSITORY:-}" ] || [ -z "${RESTIC_PASSWORD:-}" ]; then
      echo "RESTIC_REPOSITORY and RESTIC_PASSWORD are not set: put them in .env and run k3s/scripts/env-to-secrets.sh" >&2
      exit 2
    fi
    export HOME=/tmp RESTIC_CACHE_DIR=/tmp/restic-cache
    # a repository that does not exist yet is made on the first night; a wrong password or an unreachable one fails the init as well
    restic cat config > /dev/null 2>&1 || restic init
    restic backup --host oj /staging
    restic forget --host oj --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
    echo "backup done"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: backup
        spec:
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            # uid 999 like the databases and the drill: restic keeps the files' modes (0600), so what restores a snapshot
            # (the drill) must be the uid that wrote it
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: postgres:16
              command: [/bin/bash, /opt/oj/backup/dump.sh]
              envFrom:
                - prefix: IDENTITY_
                  secretRef:
                    name: env-identity-db
                - prefix: PROBLEM_
                  secretRef:
                    name: env-problem
                - prefix: SUBMISSION_
                  secretRef:
                    name: env-submission
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /opt/oj/backup
                  readOnly: true
                - name: tls
                  mountPath: /etc/oj/tls
                  readOnly: true
                - name: staging
                  mountPath: /staging
                - name: tmp
                  mountPath: /tmp
            - name: mirror
              image: ghcr.io/my-online-judge/minio:RELEASE.2025-09-07T16-13-09Z
              command: [/bin/bash, /opt/oj/backup/mirror.sh]
              envFrom:
                - secretRef:
                    name: minio-init
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /opt/oj/backup
                  readOnly: true
                - name: tls
                  mountPath: /etc/oj/tls
                  readOnly: true
                - name: staging
                  mountPath: /staging
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: restic
              image: restic/restic:0.17.3
              command: [/bin/sh, /opt/oj/backup/restic.sh]
              envFrom:
                - secretRef:
                    name: restic
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 384Mi
              volumeMounts:
                - name: scripts
                  mountPath: /opt/oj/backup
                  readOnly: true
                - name: staging
                  mountPath: /staging
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: tls
              secret:
                secretName: tls-backup
                defaultMode: 0440
            # dumps hold password hashes; the volume goes with the pod
            - name: staging
              emptyDir:
                sizeLimit: 4Gi
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-drill
spec:
  # never runs by itself: kubectl -n oj create job drill-$(date +%s) --from=cronjob/restore-drill (k3s/scripts/restore-drill.sh does it)
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: restore-drill
        spec:
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: restic-restore
              image: restic/restic:0.17.3
              command: [/bin/sh, -c, "export HOME=/tmp RESTIC_CACHE_DIR=/tmp/restic-cache; restic restore latest --no-lock --host oj --target /restore --include /staging"]
              envFrom:
                - secretRef:
                    name: restic
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 384Mi
              volumeMounts:
                - name: restore
                  mountPath: /restore
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: verify
              image: postgres:16
              command: [/bin/bash, /opt/oj/backup/drill.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /opt/oj/backup
                  readOnly: true
                - name: restore
                  mountPath: /restore
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: restore
              emptyDir:
                sizeLimit: 4Gi
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
