apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-nginx
data:
  nginx.conf: |
    # judge-portal behind the HTTPS edge (sub-project 10), mounted over the image's /etc/nginx/nginx.conf.
    # HTTPS on 443 inside oj-net with the judge-portal certificate; only the edge (Caddy) may call: a client certificate
    # signed by the CA is required (none: nginx answers 400), and any CN but edge gets 403. $ssl_client_s_dn is RFC 2253
    # (nginx >= 1.11.6; the image runs 1.30): the last RDN comes first, so a subject of just CN=edge is "CN=edge". The
    # regex is anchored: unanchored, a CA-signed subject such as OU=CN=edge,CN=x ("CN=x,OU=CN=edge") would pass. nginx
    # runs as uid 101 and reads the key it owns (pki/identities.txt: judge-portal 101:101).
    # uid 101 cannot write /var/run or /var/cache/nginx: the pid file and the temp paths are under /tmp.
    pid /tmp/nginx.pid;
    worker_processes 4;

    events { worker_connections 1024; }

    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;
        server {
            listen 443 ssl;
            ssl_certificate         /etc/oj/tls/tls.crt;
            ssl_certificate_key     /etc/oj/tls/tls.key;
            ssl_client_certificate  /etc/oj/tls/ca.crt;
            ssl_verify_client       on;

            if ($ssl_client_s_dn !~ "^CN=edge(,|$)") {
                return 403;
            }

            root  /usr/share/nginx/html;
            include /etc/nginx/mime.types;

            location / {
                try_files $uri /index.html;
            }

            # Every route is a lazy chunk with a hashed name, so a stale index.html boots a build whose chunks are gone:
            # browsers revalidate it on every load (an unchanged one is a 304). The try_files fallback lands here too.
            location = /index.html {
                add_header Cache-Control "no-cache";
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
data:
  config.yaml: |
    # Jaeger v2 for the OJ stack (sub-project 10). Started from the upstream all-in-one config, the one the image runs without
    # --config: https://raw.githubusercontent.com/jaegertracing/jaeger/v2.21.0/cmd/jaeger/internal/all-in-one.yaml
    # Changes from it:
    #   - OTLP gRPC (4317) and HTTP (4318) listen on 0.0.0.0 over TLS with Jaeger's certificate (the jaeger subpath of the tls
    #     volume) and require a client certificate signed by our CA (client_ca_file). The services export to
    #     https://jaeger:4318 with their own certificates (x-otel-env in docker-compose.yml).
    #   - The jaeger and zipkin receivers are gone: plaintext span ingest that nothing here uses.
    #   - The in-memory store keeps at most 100000 traces (upstream's value, kept on purpose: memory is the only storage).
    # The query API and UI (16686) stay plain HTTP, published on the host's loopback only. Checked by tests/jaeger-config.test.sh.

    # Copyright (c) 2026 The Jaeger Authors.
    # SPDX-License-Identifier: Apache-2.0

    service:
      extensions: [jaeger_storage, jaeger_query, remote_sampling, healthcheckv2, expvar, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "${env:JAEGER_LISTEN_HOST:-localhost}"
                    port: 8888
        logs:
          level: info
        # TODO Initialize telemetry tracer once OTEL released new feature.
        # https://github.com/open-telemetry/opentelemetry-collector/issues/10663

    extensions:
      jaeger_query:
        storage:
          traces: some_storage
        ai:
          # Serve the Jaeger MCP tools /api/ai/mcp/
          mcp: {}

      jaeger_storage:
        backends:
          some_storage:
            memory:
              max_traces: 100000

      remote_sampling:
        # We can either use file or adaptive sampling strategy in remote_sampling
        file:
          path:
          default_sampling_probability: 1
          reload_interval: 1s
        # adaptive:
        #   sampling_store: some_store
        #   initial_sampling_probability: 0.1
        http:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5778"
        grpc:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5779"

      healthcheckv2:
        use_v2: true
        http:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:13133"
        grpc:

      expvar:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27777"

      zpages:
        # for some reason the official extension listens on ephemeral port 55679
        # so we override it with a normal port
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27778"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /etc/oj/tls/tls.crt
              key_file: /etc/oj/tls/tls.key
              client_ca_file: /etc/oj/tls/ca.crt
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /etc/oj/tls/tls.crt
              key_file: /etc/oj/tls/tls.key
              client_ca_file: /etc/oj/tls/ca.crt

    processors:
      batch:

    exporters:
      jaeger_storage_exporter:
        trace_storage: some_storage
