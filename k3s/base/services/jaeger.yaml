# Jaeger v2 collecting the services' traces over OTLP with mutual TLS (jaeger/config.yaml), the trace store in memory. The UI
# is not exposed: `kubectl -n oj port-forward deploy/jaeger 16686`.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0
          args: [--config, "file:/etc/jaeger/config.yaml"]
          env:
            - name: TZ
              value: Asia/Ho_Chi_Minh
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # at most 100000 traces in memory (jaeger/config.yaml)
            limits:
              memory: 768Mi
          startupProbe: &listening
            tcpSocket:
              port: 16686
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            <<: *listening
            periodSeconds: 10
          livenessProbe:
            <<: *listening
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tls
              mountPath: /etc/oj/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: jaeger-config
        - name: tls
          secret:
            secretName: tls-jaeger
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
