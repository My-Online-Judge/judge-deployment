# One KRaft node, as docker-compose.yml runs it: TLS with client certificates on 29092 (the brokers' and the services'
# listener) and 9093 (the controller), a plaintext listener on the pod's loopback for the probes and tools, ACLs by the
# certificate's CN (kafka-init). The broker reads every KAFKA_* variable as configuration, so the pod gets no service-link
# variables (a Service named kafka would add KAFKA_PORT and friends). tests/k3s-data.test.sh compares this environment with
# compose's, value for value.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  # The broker's controller quorum voter is kafka:9093 and the broker is not Ready until it has joined that quorum: the
  # Service must resolve to the pod before then, or the broker waits for itself for ever.
  publishNotReadyAddresses: true
  ports:
    - name: internal
      port: 29092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kafka's PEM keystore is the private key followed by the certificate; cert-manager keeps them apart.
        - name: tls-pem
          image: alpine:3.24
          command: [sh, -c, 'umask 077 && cat /in/tls.key /in/tls.crt > /out/keystore.pem && cp /in/ca.crt /out/ca.crt']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: tls-in
              mountPath: /in
              readOnly: true
            - name: tls
              mountPath: /out
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          env:
            - {name: TZ, value: Asia/Ho_Chi_Minh}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:29092,CONTROLLER://:9093,LOCAL://127.0.0.1:9092"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:29092,LOCAL://127.0.0.1:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:SSL,INTERNAL:SSL,LOCAL:PLAINTEXT"}
            - {name: KAFKA_SSL_KEYSTORE_TYPE, value: PEM}
            - {name: KAFKA_SSL_KEYSTORE_LOCATION, value: /etc/oj/tls/keystore.pem}
            - {name: KAFKA_SSL_TRUSTSTORE_TYPE, value: PEM}
            - {name: KAFKA_SSL_TRUSTSTORE_LOCATION, value: /etc/oj/tls/ca.crt}
            - {name: KAFKA_SSL_CLIENT_AUTH, value: required}
            - {name: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM, value: https}
            - {name: KAFKA_AUTHORIZER_CLASS_NAME, value: org.apache.kafka.metadata.authorizer.StandardAuthorizer}
            - {name: KAFKA_SUPER_USERS, value: "User:kafka;User:kafka-admin;User:ANONYMOUS"}
            - {name: KAFKA_SSL_PRINCIPAL_MAPPING_RULES, value: 'RULE:^CN=([^,]+)$/$1/,DEFAULT'}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_NUM_PARTITIONS, value: "6"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            # A fixed heap, min = max, and a 1Gi container limit: on one VPS an uncapped broker takes the RAM the sandboxes need.
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx512M -Xms512M"}
            - {name: CLUSTER_ID, value: LL99FafWSZyhNAgsibWLog}
          ports:
            - name: internal
              containerPort: 29092
            - name: controller
              containerPort: 9093
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          # compose's healthcheck: the plaintext loopback listener answers a topic listing
          startupProbe:
            exec:
              command: [sh, -c, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list']
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list']
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list']
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: tls
              mountPath: /etc/oj/tls
              readOnly: true
      volumes:
        - name: tls-in
          secret:
            secretName: tls-kafka
        - name: tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
