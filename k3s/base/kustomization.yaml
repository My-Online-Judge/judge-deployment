# The stack on K3s (sub-project 15): what runs, the same in every overlay. Each task of the migration plan adds its files to
# `resources`; overlays/local (k3d, mock sandbox) and overlays/vps (the server) patch only what differs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oj
resources:
  - namespace.yaml
  - pki/ca-issuer.yaml
  - pki/certificates.yaml
  - data/postgres.yaml
  - data/kafka.yaml
  - data/redis.yaml
  - data/minio.yaml
  - data/init-scripts.yaml
  - data/init-jobs.yaml
  - services/configs.yaml
  - services/java.yaml
  - services/portal.yaml
  - services/jaeger.yaml
  - judge/judge.yaml
  - keda/scaledobjects.yaml
  - edge/traefik.yaml
  - network/policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: my-online-judge
    includeSelectors: false
