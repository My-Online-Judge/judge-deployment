# Alert rules for the Online Judge stack.
#
# Firing rules go to Alertmanager (alertmanager.yml: grouped by alertname, Telegram when configured) and also show in
# the Prometheus UI (http://127.0.0.1:9090/alerts). Rules encode "what counts as broken"; routing lives there.
#
# ABSENT-SAFE BY DESIGN. Every counter-based rule wraps its query in `... or vector(0)` so an oj_*
# series that does not exist yet evaluates to 0, not to no-data. This matters because in this stack
# (Spring Boot 3.4 / Micrometer 1.14 / prometheus-metrics-core) an oj_* counter sitting idle at 0 is
# dropped from the live scrape and only reappears once it increments — pre-registering it at 0 in the
# app did NOT keep it visible (see the ops memory for the full investigation). The threshold rules
# below would still behave correctly on an absent series (empty result → inactive), but JudgeQueueStalled
# genuinely needs the guard: its `and rate(oj_verdict_total…) == 0` arm silently matches nothing when
# the series is absent, so a stalled queue with no verdicts ever recorded would never fire without it.

groups:
  - name: judge-availability
    rules:
      # The four *ServiceDown rules fire on the second failed scrape live (15 s), so a service that is down for a
      # minute is reported while it is down (sub-project 6, R6; it took 64–74 s in sub-project 5's E4). They, and
      # JudgeWorkerDown, hold off until Prometheus has run 120 s (`unless on() (time() - process_start_time_seconds…)`):
      # at a stack start every JVM is unscrapable for about a minute, which raised all of them (sub-project 7 §3.3).
      # A service that never comes up still fires, at about 150 s; one restarted on its own fires after 15 s as before.
      # `unless` fails open: without the self-scrape's series the rules fire as they did before the hold-off.
      - alert: SubmissionServiceDown
        # The scrape itself failing covers every way submission-service can die — crash, OOM, hung thread
        # pool — without needing a metric from inside the process that just stopped producing them.
        expr: up{job="submission-service"} == 0 unless on() (time() - process_start_time_seconds{job="prometheus"} <= 120)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "submission-service is not being scraped"
          description: "Prometheus has failed to scrape submission-service for 15 seconds. Submissions are not being accepted."

      - alert: ApiGatewayDown
        # The gateway is the only public entry point: while it is down the portal reaches no API at
        # all, even with every service behind it healthy.
        expr: up{job="api-gateway"} == 0 unless on() (time() - process_start_time_seconds{job="prometheus"} <= 120)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "api-gateway is not being scraped"
          description: "Prometheus has failed to scrape api-gateway for 15 seconds. The API is unreachable from the browser."

      - alert: IdentityServiceDown
        # Login, refresh and every admin screen for users, roles and bans go through identity-service;
        # submission-service and problem-service also fetch their token-signing key from it.
        expr: up{job="identity-service"} == 0 unless on() (time() - process_start_time_seconds{job="prometheus"} <= 120)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "identity-service is not being scraped"
          description: "Prometheus has failed to scrape identity-service for 15 seconds. Nobody can log in or refresh a session."

      - alert: ProblemServiceDown
        # Problem lists and pages, test-case editing and the statistics consumer live in problem-service;
        # submission-service asks it for every submission's limits and test-case version.
        expr: up{job="problem-service"} == 0 unless on() (time() - process_start_time_seconds{job="prometheus"} <= 120)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "problem-service is not being scraped"
          description: "Prometheus has failed to scrape problem-service for 15 seconds. Problem pages fail and submissions are refused with 503."

      - alert: ProblemServiceCircuitOpen
        # submission-service's breaker around problem-service (GrpcProblemCatalog) is refusing calls: submissions get 503
        # without problem-service being asked. It can open while problem-service still answers its scrape —
        # slow or failing calls are enough. While users keep submitting it cycles OPEN (10 s) -> HALF_OPEN
        # (three probes) -> OPEN, so the rule looks for OPEN anywhere in the last minute. HALF_OPEN alone lets
        # calls through: on a quiet site the breaker can wait there for its probes after a recovery.
        expr: max(max_over_time(resilience4j_circuitbreaker_state{name="problem-service", state="open"}[1m])) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "submission-service has stopped calling problem-service (circuit breaker open)"
          description: "Submissions are refused with 503 without trying problem-service. Check ProblemServiceDown and the GrpcProblemCatalog lines in the submission-service log."

  - name: judge-pipeline
    rules:
      - alert: JudgeSystemErrors
        # SYSTEM_ERROR is never the submitter's fault: it means the sandbox, the worker, or the
        # test-case bundle broke. One is a bug; a rate above zero is an outage in progress.
        expr: (sum(rate(oj_verdict_total{status="SYSTEM_ERROR"}[10m])) or vector(0)) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Submissions are returning SYSTEM_ERROR"
          description: "The judging pipeline is failing internally — check the sandboxes and judge-worker logs, not the submitted code."

      - alert: JudgeQueueStalled
        # Distinct from "busy": a queue that is non-empty AND not draining means nothing is being
        # judged at all. The verdict arm is absent-safe: without `or vector(0)`, a queue that stalls
        # before ANY verdict has ever been recorded leaves oj_verdict_total absent, the `== 0` arm
        # matches nothing, and this rule never fires — the exact outage it exists to catch.
        # `and on()`: the right arm is aggregated to a label-less scalar-like vector, so it must be
        # joined on the empty label set or it would never match oj_queue_depth's {job,instance} labels.
        expr: oj_queue_depth > 0 and on() (sum(rate(oj_verdict_total[15m])) or vector(0)) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Submissions are queued but no verdicts are being produced"
          description: "oj_queue_depth has been above zero for 15m with zero verdicts in the same window — the worker or both sandboxes are down."

      - alert: OutboxBacklogStale
        # Every judge request (submission.requested) and verdict event leaves submission-service through its
        # outbox. A row is normally sent within a second of its commit; one older than a minute means
        # Kafka is unreachable or the relay is stuck — submissions are accepted but nobody judges them.
        expr: oj_outbox_oldest_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "submission-service's outbox is not reaching Kafka"
          description: "The oldest unsent outbox row has waited over a minute — check Kafka and the OutboxRelay lines in the submission-service log."

      - alert: ProblemStatsDeadLettered
        # problem-service's statistics consumer gave up on a record of oj.submission.events: unreadable at
        # once, anything else after ~5.5 minutes of retries. Its count is missing until the dead letters are
        # replayed (safe: a submission is counted once). The counter itself, not increase(): a new series
        # starts at 1, and increase() over its first sample is 0.
        expr: max(oj_stats_dead_lettered_total) > 0
        labels:
          severity: warning
        annotations:
          summary: "problem-service dead-lettered verdict events; statistics are missing counts"
          description: "Records on oj.submission.events.dlq were not counted. Fix the cause in the problem-service log, then replay them (oj-problem-service README); the alert clears when problem-service restarts."

      - alert: VerdictDeadLettered
        # submission-service's verdict consumer gave up on a record of submission.judged: unreadable or invalid at
        # once, anything else after ~5 minutes of retries. The verdict is not applied until it is replayed. Zero
        # counters are not scraped, so increase() reads 0 over a series' first sample: the second clause catches a
        # brand-new series (present now, absent 10 minutes ago).
        expr: (sum(increase(oj_verdict_dead_lettered_total[10m])) > 0) or (sum(oj_verdict_dead_lettered_total unless oj_verdict_dead_lettered_total offset 10m) > 0)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "submission-service dead-lettered verdicts"
          description: "Verdicts on submission.judged.dlq were not applied. Fix the cause, check the submission is still pending (status 6/7; otherwise rejudge it), then run scripts/replay-dlq.sh submission.judged.dlq submission.judged."

      - alert: KafkaConsumerLagging
        # The verdict consumer (judge-api-results) or problem-service's statistics consumer has stayed behind its
        # topic for 5 minutes. records_lag_max is updated only while the consumer polls: one that is stuck stops
        # reporting, and JudgeQueueStalled, OutboxBacklogStale and ProblemStatsDeadLettered cover that case.
        # The threshold is twice the highest verdict-consumer lag the load tests saw while the system kept up, and at
        # least 10 (bench/REPORT.md, E5). They saw none, so the floor applies: below it a burst is normal, above it for
        # 5 minutes a consumer is falling behind.
        expr: max by (job, client_id) (kafka_consumer_fetch_manager_records_lag_max{job=~"submission-service|problem-service"}) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A Kafka consumer of {{ $labels.job }} has been behind for 5 minutes"
          description: "{{ $labels.client_id }} has not caught up with its topic for 5 minutes. A consumer that stops polling stops updating this metric — JudgeQueueStalled, OutboxBacklogStale and ProblemStatsDeadLettered cover that case, and ConsumerLagHigh (kafka-exporter, per consumer group) sees a group that stopped polling."

  - name: judge-abuse
    rules:
      - alert: LoginLockoutSpike
        # Spec C locks an account/ip/device after repeated failures. A handful of lockouts an hour is
        # users fat-fingering passwords; a sustained rate is a credential-stuffing run worth looking at.
        expr: (sum(increase(oj_login_rate_limited_total[15m])) or vector(0)) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Login lockouts are firing repeatedly"
          description: "More than 20 login attempts were refused by the rate limiter in 15 minutes — check /admin/security for the offending ip or device."

      - alert: BannedRequestFlood
        # A ban already blocks these requests, so this is not an availability alert — it is the signal
        # that a banned actor is still hammering, which is what justifies escalating beyond the app.
        expr: (sum(increase(oj_request_banned_total[15m])) or vector(0)) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A banned ip or device is still sending heavy traffic"
          description: "Over 100 requests were refused by the access-ban filter in 15 minutes — consider blocking upstream of the app."

  - name: judge-dependencies
    # Sub-project 6 §3.1: a rule for each dependency sub-project 5's E4 stopped without any alert firing. `for: 15s`
    # is two evaluations live and three on the bench (5 s), so each fires while a one-minute outage lasts.
    rules:
      - alert: JudgeWorkerDown
        # No judge-worker answers its /metrics scrape. Workers are found through DNS (prometheus.yml), so a stopped
        # one drops out of the targets instead of reporting up == 0: the rule asks whether ANY worker is up. One dead
        # worker among several is not caught here (spec §1, out of scope).
        expr: absent(up{job="judge-worker"} == 1) unless on() (time() - process_start_time_seconds{job="prometheus"} <= 120)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "No judge-worker is running"
          description: "No judge-worker has answered a scrape for 15 seconds, so nothing is being judged. Check the judge-worker containers."

      - alert: RunWorkerDown
        # The run lane (Run code design §9): no run-worker answers its scrape (found through DNS like judge-worker, so a
        # stopped replica drops out of the targets). Submit keeps working, so a warning: Run answers 504 until it is back.
        expr: absent(up{job="run-worker"} == 1) unless on() (time() - process_start_time_seconds{job="prometheus"} <= 120)
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "No run-worker is running"
          description: "No run-worker has answered a scrape for 15 seconds, so Run answers 504 while Submit keeps working. Check the run-worker containers."

      - alert: SandboxDown
        # The worker pings every sandbox every 10 s, and a failed dispatch marks one down at once (oj_sandbox_up).
        # When the worker itself is down this series disappears with it, and JudgeWorkerDown fires instead.
        expr: min by (sandbox) (oj_sandbox_up) == 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Sandbox {{ $labels.sandbox }} is not answering"
          description: "The judge-worker cannot reach sandbox {{ $labels.sandbox }}; submissions go to the other sandboxes."

      - alert: KafkaUnreachable
        # Every Kafka consumer keeps connections to the broker; one with none has lost Kafka. A service that is down
        # loses this series altogether, and its *ServiceDown rule fires instead.
        expr: max by (job) (kafka_consumer_connection_count{job=~"submission-service|problem-service"}) == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has lost its connection to Kafka"
          description: "No judge requests or verdicts are moving. Submissions wait in the outbox until Kafka is back."

      - alert: RedisUnavailable
        # Every request or broadcast that went on only because a Redis call failed (fail-open) is counted. The rule
        # needs traffic: with no requests nobody is affected. An absent series is no data, so the rule is inactive.
        expr: sum by (job) (rate(oj_redis_fallback_total[1m])) > 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} cannot reach Redis"
          description: "Requests are let through without the ban, revocation and cooldown checks (fail-open). Check oj-redis."

  - name: oj-security
    rules:
      - alert: DefaultAdminPassword
        # identity evaluates the gauge at startup and after every password change (never on scrape). An absent series
        # is no data, so the rule is inactive.
        expr: max(oj_identity_default_admin_password) == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The root admin still uses the published seed password"
          description: "User 'admin' still has the seed password from the repository. Change it: PUT /api/v1/users/me/password."

      - alert: TlsCertificateExpiringSoon
        # Spring Boot's SSL bundle metric (bundle "oj"), one series per certificate in the chain. Leaves live 365 days:
        # re-issue with pki/pki.sh and restart. An absent series is no data, so the rule is inactive.
        expr: min by (job, instance) (ssl_chain_expiry_seconds) < 30 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} certificate expires within 30 days"
          description: "The soonest-expiring certificate in {{ $labels.instance }}'s SSL bundle has under 30 days left (ssl_chain_expiry_seconds). Re-issue with pki/pki.sh issue-all, run tls-init (docker compose up -d) and restart {{ $labels.job }}."

  - name: oj-saturation
    # Sp12 task 16: error rate, latency, backlog, and host/container saturation. HighErrorRate and HighLatency leave out
    # /actuator (only api-gateway records its own; scrapes and healthchecks are constant) and HighLatency leaves out
    # SSE verdict streams (they last as long as judging). Both need 0.1 req/s, so one failure on a quiet service is silent.
    rules:
      - alert: HighErrorRate
        expr: sum by (job) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) / sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.05 and sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} answers over 5% of its requests with a 5xx status"
          description: "Find the failing uri and status in http_server_requests_seconds_count{job=\"{{ $labels.job }}\", status=~\"5..\"}, then read the {{ $labels.job }} log and check its upstream services (the *ServiceDown alerts)."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*|.*/stream"}[10m]))) > 1 and sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|.*/stream"}[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has a 95th percentile latency over 1 second"
          description: "Find the slow uri with histogram_quantile(0.95, sum by (uri, le) (rate(http_server_requests_seconds_bucket{job=\"{{ $labels.job }}\"}[10m]))), then check that service's database and its CPU (ContainerMemoryNearLimit, cAdvisor)."

      - alert: JudgeQueueBacklog
        # SPEC DEVIATION (controller ruling Q1): the spec says 200. The live queue is capped at JUDGE_MAX_QUEUE_DEPTH=200,
        # and a threshold equal to the cap can never fire. Keep this threshold below any cap a deployment sets (README).
        expr: oj_queue_depth > 150
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has more than 150 submissions waiting for a judge"
          description: "oj_queue_depth has been above 150 for 5 minutes. Check judge-worker and the sandboxes (SandboxDown, JudgeWorkerDown); submissions are refused with 503 at JUDGE_MAX_QUEUE_DEPTH, so keep this threshold below that cap."

      - alert: JudgeLatencyHigh
        # Submit to verdict, over every problem. Buckets reach 600 s, so 60 s is measurable.
        expr: histogram_quantile(0.95, sum by (le) (rate(oj_judge_latency_seconds_bucket[10m]))) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Judging takes over 60 seconds at the 95th percentile (submit to verdict)"
          description: "Compare oj_queue_depth (a backlog) with the sandboxes' load (cAdvisor) and the slowest problems' time limit times test count; a few heavy problems can lift the percentile on their own."

      - alert: HostDiskAlmostFull
        # Real filesystems only: tmpfs, overlay and a small vfat /boot/efi are not what fills up.
        expr: node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has under 10% free"
          description: "Check docker system df and the log volumes (json-file rotation is 3 x 10 MB per container), Prometheus and Postgres data, then prune images or grow the disk."

      - alert: ContainerMemoryNearLimit
        # A container without mem_limit reports a limit of 0 (ratio +Inf): `> 0` drops it.
        expr: container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} uses over 90% of its memory limit"
          description: "Check docker stats for {{ $labels.name }} and its log for a leak or an oversized request; raise mem_limit in the compose file only if the load is legitimate (an OOM kill restarts the container)."

      - alert: ConsumerLagHigh
        # Exporter side: also sees a group that stopped polling, which KafkaConsumerLagging (client side) cannot.
        expr: max by (consumergroup, topic) (kafka_consumergroup_lag_sum) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is over 100 messages behind on {{ $labels.topic }}"
          description: "Unlike KafkaConsumerLagging (the client's own records-lag-max, silent once a consumer stops polling) this sees a group that stopped. Check the consumer service's log and its Kafka connection (KafkaUnreachable)."
