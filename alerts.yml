# Alert rules for the Online Judge stack.
#
# There is no Alertmanager in this deployment yet, so a firing rule shows up in the Prometheus UI
# (http://127.0.0.1:9090/alerts) and nowhere else. That is deliberate: rules encode "what counts as
# broken" and are worth having before the paging plumbing exists — wiring Alertmanager later needs
# no change here.
#
# ABSENT-SAFE BY DESIGN. Every counter-based rule wraps its query in `... or vector(0)` so an oj_*
# series that does not exist yet evaluates to 0, not to no-data. This matters because in this stack
# (Spring Boot 3.4 / Micrometer 1.14 / prometheus-metrics-core) an oj_* counter sitting idle at 0 is
# dropped from the live scrape and only reappears once it increments — pre-registering it at 0 in the
# app did NOT keep it visible (see the ops memory for the full investigation). The threshold rules
# below would still behave correctly on an absent series (empty result → inactive), but JudgeQueueStalled
# genuinely needs the guard: its `and rate(oj_verdict_total…) == 0` arm silently matches nothing when
# the series is absent, so a stalled queue with no verdicts ever recorded would never fire without it.

groups:
  - name: judge-availability
    rules:
      - alert: JudgeApiDown
        # The scrape itself failing covers every way judge-api can die — crash, OOM, hung thread
        # pool — without needing a metric from inside the process that just stopped producing them.
        expr: up{job="judge-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "judge-api is not being scraped"
          description: "Prometheus has failed to scrape judge-api for over a minute. Submissions are not being accepted."

      - alert: ApiGatewayDown
        # The gateway is the only public entry point: while it is down the portal reaches no API at
        # all, even with every service behind it healthy.
        expr: up{job="api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "api-gateway is not being scraped"
          description: "Prometheus has failed to scrape api-gateway for over a minute. The API is unreachable from the browser."

      - alert: IdentityServiceDown
        # Login, refresh and every admin screen for users, roles and bans go through identity-service;
        # judge-api also fetches its token-signing key from it.
        expr: up{job="identity-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "identity-service is not being scraped"
          description: "Prometheus has failed to scrape identity-service for over a minute. Nobody can log in or refresh a session."

      - alert: ProblemServiceDown
        # Problem lists and pages, test-case editing and the statistics consumer live in problem-service;
        # judge-api asks it for every submission's limits and test-case version.
        expr: up{job="problem-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "problem-service is not being scraped"
          description: "Prometheus has failed to scrape problem-service for over a minute. Problem pages fail and submissions are refused with 503."

      - alert: ProblemServiceCircuitOpen
        # judge-api's breaker around problem-service (GrpcProblemCatalog) is refusing calls: submissions get 503
        # without problem-service being asked. It can open while problem-service still answers its scrape —
        # slow or failing calls are enough. While users keep submitting it cycles OPEN (10 s) -> HALF_OPEN
        # (three probes) -> OPEN, so the rule looks for OPEN anywhere in the last minute. HALF_OPEN alone lets
        # calls through: on a quiet site the breaker can wait there for its probes after a recovery.
        expr: max(max_over_time(resilience4j_circuitbreaker_state{name="problem-service", state="open"}[1m])) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "judge-api has stopped calling problem-service (circuit breaker open)"
          description: "Submissions are refused with 503 without trying problem-service. Check ProblemServiceDown and the GrpcProblemCatalog lines in the judge-api log."

  - name: judge-pipeline
    rules:
      - alert: JudgeSystemErrors
        # SYSTEM_ERROR is never the submitter's fault: it means the sandbox, the worker, or the
        # test-case bundle broke. One is a bug; a rate above zero is an outage in progress.
        expr: (sum(rate(oj_verdict_total{status="SYSTEM_ERROR"}[10m])) or vector(0)) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Submissions are returning SYSTEM_ERROR"
          description: "The judging pipeline is failing internally — check the sandboxes and judge-worker logs, not the submitted code."

      - alert: JudgeQueueStalled
        # Distinct from "busy": a queue that is non-empty AND not draining means nothing is being
        # judged at all. The verdict arm is absent-safe: without `or vector(0)`, a queue that stalls
        # before ANY verdict has ever been recorded leaves oj_verdict_total absent, the `== 0` arm
        # matches nothing, and this rule never fires — the exact outage it exists to catch.
        # `and on()`: the right arm is aggregated to a label-less scalar-like vector, so it must be
        # joined on the empty label set or it would never match oj_queue_depth's {job,instance} labels.
        expr: oj_queue_depth > 0 and on() (sum(rate(oj_verdict_total[15m])) or vector(0)) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Submissions are queued but no verdicts are being produced"
          description: "oj_queue_depth has been above zero for 15m with zero verdicts in the same window — the worker or both sandboxes are down."

      - alert: OutboxBacklogStale
        # Every judge request (submission.requested) and verdict event leaves judge-api through its
        # outbox. A row is normally sent within a second of its commit; one older than a minute means
        # Kafka is unreachable or the relay is stuck — submissions are accepted but nobody judges them.
        expr: oj_outbox_oldest_age_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "judge-api's outbox is not reaching Kafka"
          description: "The oldest unsent outbox row has waited over a minute — check Kafka and the OutboxRelay lines in the judge-api log."

      - alert: ProblemStatsDeadLettered
        # problem-service's statistics consumer gave up on a record of oj.submission.events: unreadable at
        # once, anything else after ~5.5 minutes of retries. Its count is missing until the dead letters are
        # replayed (safe: a submission is counted once). The counter itself, not increase(): a new series
        # starts at 1, and increase() over its first sample is 0.
        expr: max(oj_stats_dead_lettered_total) > 0
        labels:
          severity: warning
        annotations:
          summary: "problem-service dead-lettered verdict events; statistics are missing counts"
          description: "Records on oj.submission.events.dlq were not counted. Fix the cause in the problem-service log, then replay them (oj-problem-service README); the alert clears when problem-service restarts."

  - name: judge-abuse
    rules:
      - alert: LoginLockoutSpike
        # Spec C locks an account/ip/device after repeated failures. A handful of lockouts an hour is
        # users fat-fingering passwords; a sustained rate is a credential-stuffing run worth looking at.
        expr: (sum(increase(oj_login_rate_limited_total[15m])) or vector(0)) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Login lockouts are firing repeatedly"
          description: "More than 20 login attempts were refused by the rate limiter in 15 minutes — check /admin/security for the offending ip or device."

      - alert: BannedRequestFlood
        # A ban already blocks these requests, so this is not an availability alert — it is the signal
        # that a banned actor is still hammering, which is what justifies escalating beyond the app.
        expr: (sum(increase(oj_request_banned_total[15m])) or vector(0)) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A banned ip or device is still sending heavy traffic"
          description: "Over 100 requests were refused by the access-ban filter in 15 minutes — consider blocking upstream of the app."

  # TODO(tuan): two load-shaped rules are missing, and their thresholds are a judgment call about
  # this deployment rather than something derivable from the code:
  #
  #   - JudgeQueueBacklog: oj_queue_depth stays above N for M minutes.
  #       N depends on how many submissions you expect at peak (a class of 40 all submitting at the
  #       bell is normal; 200 pending is not) and on the 2-sandbox throughput.
  #
  #   - JudgeLatencyHigh: histogram_quantile(0.95, sum(rate(oj_judge_latency_seconds_bucket[10m])) by (le)) > S
  #       S is a submit-to-verdict SLO. Anchor it to the worst-case problem: time limit x test count
  #       x safety factor, not to the A+B measurement of ~20ms.
