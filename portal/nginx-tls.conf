# judge-portal behind the HTTPS edge (sub-project 10), mounted over the image's /etc/nginx/nginx.conf.
# HTTPS on 443 inside oj-net with the judge-portal certificate; only the edge (Caddy) may call: a client certificate
# signed by the CA is required (none: nginx answers 400), and any CN but edge gets 403. $ssl_client_s_dn is RFC 2253
# (nginx >= 1.11.6; the image runs 1.30): the last RDN comes first, so a subject of just CN=edge is "CN=edge". The
# regex is anchored: unanchored, a CA-signed subject such as OU=CN=edge,CN=x ("CN=x,OU=CN=edge") would pass. The nginx
# master reads the key as root (pki/identities.txt: judge-portal 0:0).
worker_processes 4;

events { worker_connections 1024; }

http {
    server {
        listen 443 ssl;
        ssl_certificate         /etc/oj/tls/tls.crt;
        ssl_certificate_key     /etc/oj/tls/tls.key;
        ssl_client_certificate  /etc/oj/tls/ca.crt;
        ssl_verify_client       on;

        if ($ssl_client_s_dn !~ "^CN=edge(,|$)") {
            return 403;
        }

        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        location / {
            try_files $uri /index.html;
        }
    }
}
