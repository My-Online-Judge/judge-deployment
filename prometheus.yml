global:
  scrape_interval: 15s
  # Rules are re-evaluated on this cadence. The shortest `for:` in alerts.yml is 15s (the *Down rules and the
  # dependency rules), so those fire on their second evaluation; the others are confirmed several times.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: submission-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['submission-service:8081']

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['identity-service:8081']

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8081']

  - job_name: problem-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['problem-service:8081']

  - job_name: judge-worker
    # One target per worker replica (docker compose --scale judge-worker=N): the name resolves to every replica.
    # A stopped worker drops out at the next refresh; JudgeWorkerDown asks whether any worker is still up.
    dns_sd_configs:
      - names: ['judge-worker']
        type: A
        port: 9100
        refresh_interval: 5s
