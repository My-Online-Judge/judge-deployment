global:
  scrape_interval: 15s
  # Rules are re-evaluated on this cadence; the shortest `for:` in alerts.yml is 1m, so a rule is
  # confirmed several times before it fires.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: submission-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['submission-service:8081']

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['identity-service:8081']

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8081']

  - job_name: problem-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['problem-service:8081']
