global:
  scrape_interval: 15s
  # Rules are re-evaluated on this cadence. The shortest `for:` in alerts.yml is 15s (the *Down rules and the
  # dependency rules), so those fire on their second evaluation; the others are confirmed several times.
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    # Prometheus itself: process_start_time_seconds{job="prometheus"} tells the *Down rules (alerts.yml) that the
    # stack has just started, so a JVM still booting is not reported down (sub-project 7 §3.3).
    static_configs:
      - targets: ['localhost:9090']

  # The service actuators and the worker's /metrics require a CA-signed client certificate (no CN allowlist): Prometheus
  # presents its own, from the tls volume (subpath prometheus).
  - job_name: submission-service
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['submission-service:8081']

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['identity-service:8081']

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['api-gateway:8081']

  - job_name: problem-service
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['problem-service:8081']

  - job_name: judge-worker
    # One target per worker replica (docker compose --scale judge-worker=N): the name resolves to every replica.
    # A stopped worker drops out at the next refresh; JudgeWorkerDown asks whether any worker is still up.
    # The targets are IP addresses, so server_name names the host the worker's certificate is checked against.
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key, server_name: judge-worker}
    dns_sd_configs:
      - names: ['judge-worker']
        type: A
        port: 9100
        refresh_interval: 5s

  - job_name: run-worker
    # The run lane (Run code design §9): the judge-worker image under its own name and certificate, found the same way.
    # RunWorkerDown asks whether any replica is still up.
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key, server_name: run-worker}
    dns_sd_configs:
      - names: ['run-worker']
        type: A
        port: 9100
        refresh_interval: 5s

  # The exporters (sub-project 12): one job per service, named after it. Over mutual TLS with the same client certificate;
  # each exporter's leaf names its service, the target's host.
  - job_name: node-exporter
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: identity-db-exporter
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['identity-db-exporter:9187']

  - job_name: problem-db-exporter
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['problem-db-exporter:9187']

  - job_name: submission-db-exporter
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['submission-db-exporter:9187']

  - job_name: redis-exporter
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: kafka-exporter
    scheme: https
    tls_config: {ca_file: /etc/oj/tls/ca.crt, cert_file: /etc/oj/tls/tls.crt, key_file: /etc/oj/tls/tls.key}
    static_configs:
      - targets: ['kafka-exporter:9308']

  # cAdvisor has no TLS: plain HTTP inside oj-net (documented exception, like the loopback operator UIs).
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
