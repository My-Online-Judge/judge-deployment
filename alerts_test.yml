# promtool test rules for alerts.yml — run with: promtool test rules alerts_test.yml
#
# These exist to lock in the absent-safe behaviour: the whole point of the rewrite is that a rule
# still evaluates correctly when its oj_* counter series does not exist yet (the live scrape drops
# idle zero counters — see the ops memory). Each case that references an oj_* counter deliberately
# omits that series to prove the `or vector(0)` guard holds.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # JudgeQueueStalled is the rule that genuinely breaks without the guard: a queue that stalls before
  # any verdict was ever recorded leaves oj_verdict_total absent. Without `or vector(0)` the `and` arm
  # matches nothing and the rule never fires. Here oj_verdict_total is intentionally ABSENT.
  - interval: 1m
    input_series:
      - series: 'oj_queue_depth{job="judge-api", instance="judge-api:8000"}'
        values: '5x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: JudgeQueueStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              job: judge-api
              instance: judge-api:8000
            exp_annotations:
              summary: "Submissions are queued but no verdicts are being produced"
              description: "oj_queue_depth has been above zero for 15m with zero verdicts in the same window — the worker or both sandboxes are down."

  # Healthy pipeline: queue is draining (verdicts flowing) -> JudgeQueueStalled must stay silent.
  - interval: 1m
    input_series:
      - series: 'oj_queue_depth{job="judge-api", instance="judge-api:8000"}'
        values: '5x20'
      - series: 'oj_verdict_total{status="ACCEPTED", job="judge-api", instance="judge-api:8000"}'
        values: '0+3x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: JudgeQueueStalled
        exp_alerts: []

  # JudgeSystemErrors: absent oj_verdict_total{SYSTEM_ERROR} must read as 0, not fire, not no-data.
  - interval: 1m
    input_series:
      - series: 'oj_queue_depth{job="judge-api", instance="judge-api:8000"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: JudgeSystemErrors
        exp_alerts: []

  # JudgeSystemErrors fires once SYSTEM_ERROR verdicts actually start accumulating.
  - interval: 1m
    input_series:
      - series: 'oj_verdict_total{status="SYSTEM_ERROR", job="judge-api", instance="judge-api:8000"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: JudgeSystemErrors
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Submissions are returning SYSTEM_ERROR"
              description: "The judging pipeline is failing internally — check the sandboxes and judge-worker logs, not the submitted code."

  # LoginLockoutSpike: absent counter must not fire (and must not error on no-data).
  - interval: 1m
    input_series:
      - series: 'up{job="judge-api"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LoginLockoutSpike
        exp_alerts: []

  # LoginLockoutSpike fires on a real lockout spike (>20 in 15m).
  - interval: 1m
    input_series:
      - series: 'oj_login_rate_limited_total{job="judge-api", instance="judge-api:8000"}'
        values: '0+5x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LoginLockoutSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Login lockouts are firing repeatedly"
              description: "More than 20 login attempts were refused by the rate limiter in 15 minutes — check /admin/security for the offending ip or device."

  # ApiGatewayDown: a gateway that cannot be scraped for over a minute must fire...
  - interval: 1m
    input_series:
      - series: 'up{job="api-gateway", instance="api-gateway:8081"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: ApiGatewayDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: api-gateway
              instance: api-gateway:8081
            exp_annotations:
              summary: "api-gateway is not being scraped"
              description: "Prometheus has failed to scrape api-gateway for over a minute. The API is unreachable from the browser."

  # ...and a healthy gateway must stay silent.
  - interval: 1m
    input_series:
      - series: 'up{job="api-gateway", instance="api-gateway:8081"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiGatewayDown
        exp_alerts: []

  # IdentityServiceDown: an identity-service that cannot be scraped for over a minute must fire...
  - interval: 1m
    input_series:
      - series: 'up{job="identity-service", instance="identity-service:8081"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: IdentityServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: identity-service
              instance: identity-service:8081
            exp_annotations:
              summary: "identity-service is not being scraped"
              description: "Prometheus has failed to scrape identity-service for over a minute. Nobody can log in or refresh a session."

  # ...and a healthy identity-service must stay silent.
  - interval: 1m
    input_series:
      - series: 'up{job="identity-service", instance="identity-service:8081"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: IdentityServiceDown
        exp_alerts: []

  # OutboxBacklogStale: rows stuck in the outbox for over a minute (Kafka down) must fire...
  - interval: 1m
    input_series:
      - series: 'oj_outbox_oldest_age_seconds{job="judge-api", instance="judge-api:8000"}'
        values: '30 90 150 210 270 330'
    alert_rule_test:
      - eval_time: 4m
        alertname: OutboxBacklogStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: judge-api
              instance: judge-api:8000
            exp_annotations:
              summary: "judge-api's outbox is not reaching Kafka"
              description: "The oldest unsent outbox row has waited over a minute — check Kafka and the OutboxRelay lines in the judge-api log."

  # ...while a relay that keeps up (rows leave within seconds) stays silent.
  - interval: 1m
    input_series:
      - series: 'oj_outbox_oldest_age_seconds{job="judge-api", instance="judge-api:8000"}'
        values: '0 2 0 1 0 3'
    alert_rule_test:
      - eval_time: 5m
        alertname: OutboxBacklogStale
        exp_alerts: []

  # ProblemServiceDown: a problem-service that cannot be scraped for over a minute must fire...
  - interval: 1m
    input_series:
      - series: 'up{job="problem-service", instance="problem-service:8081"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: ProblemServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: problem-service
              instance: problem-service:8081
            exp_annotations:
              summary: "problem-service is not being scraped"
              description: "Prometheus has failed to scrape problem-service for over a minute. Problem pages fail and submissions are refused with 503."

  # ...and a healthy problem-service must stay silent.
  - interval: 1m
    input_series:
      - series: 'up{job="problem-service", instance="problem-service:8081"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProblemServiceDown
        exp_alerts: []

  # ProblemServiceCircuitOpen: judge-api's breaker keeps refusing calls. While problem-service is down and
  # users submit, the breaker cycles OPEN (10 s) -> HALF_OPEN (three probes fail) -> OPEN; the window bridges
  # the HALF_OPEN moments.
  - interval: 1m
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="open"}'
        values: '0 1 0 1 1 0 1'
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="half_open"}'
        values: '0 0 1 0 0 1 0'
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="closed"}'
        values: '1 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 4m
        alertname: ProblemServiceCircuitOpen
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "judge-api has stopped calling problem-service (circuit breaker open)"
              description: "Submissions are refused with 503 without trying problem-service. Check ProblemServiceDown and the GrpcProblemCatalog lines in the judge-api log."

  # ...but HALF_OPEN alone is not refusing anything: after a recovery on a quiet site the breaker can wait
  # there for its probe calls, and that must not keep the alert firing.
  - interval: 1m
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="open"}'
        values: '1 0 0 0 0 0 0'
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="half_open"}'
        values: '0 1 1 1 1 1 1'
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="closed"}'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 6m
        alertname: ProblemServiceCircuitOpen
        exp_alerts: []

  # ...and a closed breaker must stay silent.
  - interval: 1m
    input_series:
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="open"}'
        values: '0x5'
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="half_open"}'
        values: '0x5'
      - series: 'resilience4j_circuitbreaker_state{job="judge-api", instance="judge-api:8000", name="problem-service", state="closed"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProblemServiceCircuitOpen
        exp_alerts: []

  # ProblemStatsDeadLettered: the statistics consumer gave up on a record — a count is missing until the
  # dead letters are replayed. A brand-new counter series starts at its first value (1), so the rule reads
  # the counter itself, not increase().
  - interval: 1m
    input_series:
      - series: 'oj_stats_dead_lettered_total{job="problem-service", instance="problem-service:8081"}'
        values: '_ _ 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: ProblemStatsDeadLettered
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "problem-service dead-lettered verdict events; statistics are missing counts"
              description: "Records on oj.submission.events.dlq were not counted. Fix the cause in the problem-service log, then replay them (oj-problem-service README); the alert clears when problem-service restarts."

  # ...and no dead letter (the counter absent, as in a fresh scrape) stays silent.
  - interval: 1m
    input_series:
      - series: 'up{job="problem-service", instance="problem-service:8081"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProblemStatsDeadLettered
        exp_alerts: []
