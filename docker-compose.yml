# Authoritative Online Judge stack — the single source of truth for deploying every service.
# Build contexts point back at the sibling repos; only configuration lives here.
#
#   cd judge-deployment
#   docker compose build <service>    # each built service, one image at a time on this host (README "Images")
#   docker compose up -d --no-build                                                   # real qduoj sandbox
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --no-build  # mock sandbox (build its
#                                                                                     # judge-server with both files first)
#
# Config is centralized in ./.env (loaded automatically by Compose); identity-db and identity-service
# read ./.env.identity instead, which alone holds the JWT signing keys and the Google OAuth secret;
# problem-db and problem-service read ./.env.problem (migrations/sp2-env.sh creates it), submission-db and
# submission-service ./.env.submission (migrations/sp3-env.sh create).

# Vietnam time (GMT+7) for every service's logs and DB now()/timestamps, aliased into each service
# below. Sandboxes (judge-server, judge-server-2) are intentionally excluded — they run untrusted
# submissions and their wall-clock is irrelevant. NOTE: every Spring service also pins the JVM zone in code
# (its *Application.main) — that is what fixes its stored LocalDateTime timestamps; the TZ
# here only aligns its logs. TZ is best-effort on images without OS tzdata (alpine) — harmless if unset.
# Every container's json-file log is rotated: at most 3 files of 10 MB. Set as `logging: *logging` on every service
# (the sandboxes through x-sandbox).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-tz-env: &tz-env
  TZ: Asia/Ho_Chi_Minh

# OpenTelemetry export for every traced service (Java agent + judge-worker SDK). Jaeger is optional:
# exporters drop spans when it is unreachable, they never block a request or a judge.
# Over mutual TLS (sub-project 10): Jaeger's OTLP receivers require a client certificate from the CA
# (jaeger/config.yaml), and each service presents the one of its own tls subpath, so every service that merges
# this block mounts tls. The Java agent and OTel Python 1.45 both read these variables.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: https://jaeger:4318
  OTEL_EXPORTER_OTLP_CERTIFICATE: /etc/oj/tls/ca.crt
  OTEL_EXPORTER_OTLP_CLIENT_KEY: /etc/oj/tls/tls.key
  OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE: /etc/oj/tls/tls.crt
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

# Liveness for the QingdaoU sandboxes, shared by both instances.
#
# The image ships `python3 /code/service.py` as its HEALTHCHECK — QingdaoU's heartbeat, which POSTs
# to BACKEND_URL /api/judge_server_heartbeat/ and exits 1 on any answer not shaped like QingdaoU's
# backend, so both sandboxes reported (unhealthy) forever while judging perfectly. Ask the sandbox
# itself instead — /ping is its own liveness endpoint and returns live cpu/memory/judger_version.
# Auth is sha256(TOKEN) in X-Judge-Server-Token, computed inline because the sandbox stores the
# digest, not the raw token. Over mutual TLS (sub-project 10): the sandbox verified against the CA as
# localhost (in every SAN), presenting the sandbox's own certificate, since the server requires one.
# The sandboxes cannot reach submission-service anyway (sandbox-net):
# judge-worker relays each /ping to the judge-server registry instead (SANDBOX_HEARTBEAT_URL).
# Overridden in docker-compose.mock.yml: the mock only implements /judge.
x-sandbox-health: &sandbox-health
  test:
    - CMD
    - python3
    - -c
    - 'import hashlib,os,ssl,urllib.request as u; c=ssl.create_default_context(cafile="/etc/oj/tls/ca.crt"); c.load_cert_chain("/etc/oj/tls/tls.crt","/etc/oj/tls/tls.key"); t=hashlib.sha256(os.environ["TOKEN"].encode()).hexdigest(); u.urlopen(u.Request("https://localhost:8080/ping",data=b"{}",headers={"X-Judge-Server-Token":t,"Content-Type":"application/json"}),timeout=3,context=c)'
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 20s

# The QingdaoU sandboxes run contestants' code, so they get the least the judger needs.
# - No `privileged`: the judger isolates a run with setrlimit + its own seccomp filter + setuid to an
#   unprivileged user — no cgroups, no device access. Proven on 2026-10-05 by judging the same
#   programs (AC/WA/TLE/RE/CE in C, C++, Java, Python 3) on a privileged and on this configuration:
#   identical verdicts, and 8 judges in parallel.
# - Capabilities: CHOWN/FOWNER/DAC_OVERRIDE to prepare each run directory for the compiler and run
#   users, SETUID/SETGID to drop to them, KILL to stop a run over its time limit. Nothing else.
# - Read-only root filesystem; /judger (sources and binaries, so `exec`) and /tmp (compiler scratch)
#   are size-capped tmpfs. Docker's default seccomp and AppArmor profiles apply again.
# - Only sandbox-net: no route to Kafka, Redis, the databases, MinIO or the internet — whatever a
#   submission's language does or does not filter at the syscall level.
# - The API on 8080 is mutual TLS (sub-project 10, x-sandbox-env): only a client presenting a certificate
#   from our CA gets an HTTP answer (on sandbox-net, the worker). The key stays root's: gunicorn runs as
#   root, while compiling and running a submission drop to the users compiler, code and spj (12001-12003),
#   which cannot enter the 0700 root-owned /etc/oj/tls (checked through the judger itself on 2026-10-20).
x-sandbox: &sandbox
  image: docker.io/qduoj/judge-server@sha256:a580a1643277b4ec5a103a46fe1dbfe8537c437996955f82a5a22801ec73239e
  logging: *logging
  restart: always
  shm_size: 256m
  mem_limit: 3g
  cpus: 6
  pids_limit: 1024
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs:
    - /judger:exec,mode=755,size=1g
    - /tmp:size=256m
  healthcheck: *sandbox-health
  depends_on:
    tls-init:
      condition: service_completed_successfully
  networks: [sandbox-net]

# Each sandbox's environment. gunicorn 20.0.4 reads GUNICORN_CMD_ARGS beside the image's own flags (workers, threads,
# log, timeout, bind: none overlap): 8080 serves TLS with the certificate of the sandbox's tls subpath, and
# --cert-reqs=2 (ssl.CERT_REQUIRED) refuses a client without one signed by ca.crt. A missing file stops gunicorn at
# start, never plaintext.
x-sandbox-env: &sandbox-env
  TOKEN: ${JUDGE_SERVER_TOKEN}
  GUNICORN_CMD_ARGS: --certfile=/etc/oj/tls/tls.crt --keyfile=/etc/oj/tls/tls.key --ca-certs=/etc/oj/tls/ca.crt --cert-reqs=2

# The JVM services' options: the OpenTelemetry agent, heap sizing, and DNS caching. The JDK keeps a resolved address
# 30 s and a failed lookup 10 s by default, so a stopped container's old address took connections until the cache
# expired (submit's gRPC call waited out its 2 s deadline) and a restarted one stayed unresolvable. 1 s and 0 s
# (sub-project 6 §3.2 A), set as Security properties from the jvm-dns-security config: the runtime image's
# java.security sets networkaddress.cache.negative.ttl=10, which a -Dsun.net.inetaddr.* flag cannot override.
# grpc-java's own resolver (submission-service → problem-service) reads networkaddress.cache.ttl as a SYSTEM property,
# 30 s when unset: -Dnetworkaddress.cache.ttl=1 (sub-project 7 §3.1 F1). The JDK ignores that system property.
x-postgres-tls: &postgres-tls
  # TLS (sub-project 10): server certificate, client certificates required (pg-hba), plaintext refused. The three
  # databases share this block; each adds its own tls volume mount (subpath = its service name).
  command:
    - postgres
    - -c
    - timezone=Asia/Ho_Chi_Minh
    - -c
    - log_timezone=Asia/Ho_Chi_Minh
    - -c
    - ssl=on
    - -c
    - ssl_cert_file=/etc/oj/tls/tls.crt
    - -c
    - ssl_key_file=/etc/oj/tls/tls.key
    - -c
    - ssl_ca_file=/etc/oj/tls/ca.crt
    - -c
    - hba_file=/etc/oj/pg_hba.conf
  configs:
    - source: pg-hba
      target: /etc/oj/pg_hba.conf
  depends_on:
    tls-init:
      condition: service_completed_successfully

x-java-tool-options: &java-tool-options >-
  -javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=75
  -Djava.security.properties=/opt/oj/jvm-dns.security -Dnetworkaddress.cache.ttl=1
x-jvm-dns-configs: &jvm-dns-configs
  - source: jvm-dns-security
    target: /opt/oj/jvm-dns.security

services:
  # ---- TLS material (sub-project 10) ----------------------------------------
  # One-shot: copies pki/out/<id>/ into the tls volume, owned per pki/identities.txt. Every service that gets a
  # certificate mounts tls with volume.subpath: <its id> at /etc/oj/tls and waits for this to complete.
  tls-init:
    logging: *logging
    image: alpine:3.22
    restart: "no"
    entrypoint: ["/bin/sh", "/install.sh"]
    volumes:
      - ./pki/out:/pki:ro
      - ./pki/install.sh:/install.sh:ro
      - ./pki/identities.txt:/identities.txt:ro
      - tls:/tls
    # No network at all: it mounts the whole of pki/out (CA key included), so it must not be reachable.
    network_mode: none

  # ---- infrastructure ------------------------------------------------------
  identity-db:
    logging: *logging
    image: postgres:16
    container_name: oj-identity-db
    restart: unless-stopped
    <<: *postgres-tls
    environment:
      <<: *tz-env
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD only (.env.identity-db), so identity's JWT and Google secrets
    # stay out of the database container.
    env_file:
      - .env.identity-db
    # No host port. Schema: identity-service's Flyway (V1 schema, V2 seed) on first boot.
    volumes:
      - identitydata:/var/lib/postgresql/data
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: identity-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [oj-net]

  problem-db:
    logging: *logging
    image: postgres:16
    container_name: oj-problem-db
    restart: unless-stopped
    <<: *postgres-tls
    environment:
      <<: *tz-env
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD. Nothing outside the problem containers reads it.
    env_file:
      - .env.problem
    # No host port. Schema: problem-service's Flyway (V1 the problem tables, V2 statistics) on first boot.
    volumes:
      - problemdata:/var/lib/postgresql/data
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: problem-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [oj-net]

  submission-db:
    logging: *logging
    image: postgres:16
    container_name: oj-submission-db
    restart: unless-stopped
    <<: *postgres-tls
    environment:
      <<: *tz-env
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD. Nothing outside the submission containers reads it.
    env_file:
      - .env.submission
    # No host port. Schema: oj-submission-service's Flyway (V1 the submission tables, V2 the languages), applied by
    # migrations/sp3-flyway.sh before the service first starts.
    volumes:
      - submissiondata:/var/lib/postgresql/data
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: submission-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [oj-net]

  kafka:
    logging: *logging
    # 3.9.0's image ships a broken /bin/bash (readline relocation errors) that makes the
    # entrypoint exit 127 on this host. 3.8.1 has a working bash and identical env convention.
    image: apache/kafka:3.8.1
    container_name: oj-kafka
    restart: unless-stopped
    # No host port. Services and the worker use INTERNAL (kafka:29092); INTERNAL and CONTROLLER speak TLS and require a
    # client certificate signed by the private CA, with host names verified (sub-project 10). LOCAL is PLAINTEXT and
    # bound to the container's loopback: only tools run inside it (the healthcheck, bench drain) can reach it.
    # The protocols live only in the map: SSL:// in KAFKA_ADVERTISED_LISTENERS sends the image's wrapper down a
    # JKS-only path. keystore.pem is the unencrypted key followed by the certificate (pki/pki.sh).
    environment:
      <<: *tz-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,LOCAL://127.0.0.1:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,LOCAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL,LOCAL:PLAINTEXT
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/oj/tls/keystore.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/oj/tls/ca.crt
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      # ACLs (sub-project 10 §4.5): a client's principal is its certificate's CN, and each service may use only its own
      # topics and group (kafka/acls.sh, written by kafka-init). Super users: kafka (this broker and its controller),
      # kafka-admin (kafka-init) and ANONYMOUS, which only LOCAL can produce: the TLS listeners require a certificate.
      # $$ is Compose's escape for a literal $.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:kafka;User:kafka-admin;User:ANONYMOUS
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=([^,]+)$$/$$1/,DEFAULT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # judge-worker subscribes to submission.requested before submission-service declares it; an auto-created
      # topic must then get the declared 6 partitions, or the worker only sees the extra ones after its 5-minute
      # metadata refresh (submissions sat PENDING). With the volume below an empty broker is a first start only.
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      # Topics, messages and committed offsets live on the named volume and survive a recreated container.
      # The cluster id is fixed because the formatted volume records it: a different id refuses to start.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: LL99FafWSZyhNAgsibWLog
    depends_on:
      tls-init:
        condition: service_completed_successfully
    volumes:
      - kafkadata:/var/lib/kafka/data
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [oj-net]

  kafka-init:
    logging: *logging
    # One-shot (sub-project 10 §4.5): writes the services' ACLs (kafka/acls.sh) with the super user kafka-admin's
    # certificate, then exits. --add is idempotent, so it runs on every `up`; the services that use Kafka wait for it.
    image: apache/kafka:3.8.1
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/oj/kafka/acls.sh"]
    depends_on:
      tls-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka:/opt/oj/kafka:ro
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: kafka-admin
    networks: [oj-net]

  redis:
    logging: *logging
    # Pub/sub for the verdict SSE fan-out, and the ban mirror, logout blocklist, session-revocation cutoffs and rate
    # limits. Append-only file on a named volume: a logged-out or revoked token must stay revoked across
    # `docker compose down`/`up` (access tokens live 24 h). everysec: a crash loses at most a second of writes.
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    # TLS only (--port 0 closes the plaintext port): every client must present a certificate signed by the private CA.
    command: ["redis-server", "--port", "0", "--tls-port", "6379", "--tls-cert-file", "/etc/oj/tls/tls.crt", "--tls-key-file", "/etc/oj/tls/tls.key", "--tls-ca-cert-file", "/etc/oj/tls/ca.crt", "--tls-auth-clients", "yes", "--appendonly", "yes", "--appendfsync", "everysec"]
    environment: *tz-env
    depends_on:
      tls-init:
        condition: service_completed_successfully
    volumes:
      - redisdata:/data
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: redis
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/etc/oj/tls/ca.crt", "--cert", "/etc/oj/tls/tls.crt", "--key", "/etc/oj/tls/tls.key", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [oj-net]

  minio:
    logging: *logging
    # S3-compatible object storage: single source of truth for problem test cases (T3-8).
    # Pinned for reproducibility — this is the release the T3-8 stack was verified against. MinIO no longer
    # publishes images (Docker Hub and quay.io are empty), so this is the org's byte-identical mirror of
    # minio/minio:RELEASE.2025-09-07T16-13-09Z; source: github.com/minio/minio at that tag (AGPL-3.0).
    image: ghcr.io/my-online-judge/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: oj-minio
    restart: unless-stopped
    # TLS (sub-project 10): the API (9000) and the console (9001) serve the minio certificate; --certs-dir reads
    # public.crt, private.key and CAs/ from the minio subpath (pki/pki.sh writes them). Clients authenticate with access
    # keys, not certificates: problem-service and the worker each have their own (minio-init), only this container and
    # minio-init get the root account.
    command: server /data --console-address ":9001" --certs-dir /etc/oj/tls
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      <<: *tz-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # mc run inside this container (the healthcheck, backup/backup.sh) verifies the server against the CA.
      SSL_CERT_FILE: /etc/oj/tls/ca.crt
    depends_on:
      tls-init:
        condition: service_completed_successfully
    volumes:
      - miniodata:/data
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: minio
    healthcheck:
      # mc ready asks the unauthenticated cluster-health endpoint: the credentials in the URL are placeholders.
      test: ["CMD-SHELL", "SSL_CERT_FILE=/etc/oj/tls/ca.crt MC_HOST_local=https://x:x@localhost:9000 mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [oj-net]

  minio-init:
    logging: *logging
    # One-shot (sub-project 10): with the root account, makes sure of the test-case bucket, the policies oj-problem-rw and
    # oj-worker-ro and the two service users (minio/minio-init.sh). Idempotent and non-destructive, so it runs on every
    # `up`; problem-service and the worker wait for it. Mounts the minio subpath for the CA.
    image: ghcr.io/my-online-judge/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/oj/minio/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROBLEM_ACCESS_KEY: ${MINIO_PROBLEM_ACCESS_KEY}
      MINIO_PROBLEM_SECRET_KEY: ${MINIO_PROBLEM_SECRET_KEY}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SSL_CERT_FILE: /etc/oj/tls/ca.crt
    depends_on:
      tls-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    volumes:
      - ./minio:/opt/oj/minio:ro
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: minio
    networks: [oj-net]

  prometheus:
    logging: *logging
    # Scrapes every service's /actuator/prometheus (prometheus.yml). Pinned for reproducibility.
    image: prom/prometheus:v3.15.0
    container_name: oj-prometheus
    restart: unless-stopped
    environment: *tz-env
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
      # The client certificate it presents to the actuators (mutual TLS, prometheus.yml tls_config).
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: prometheus
    ports:
      - "127.0.0.1:9090:9090"   # ops UI, loopback only
    depends_on:
      tls-init:
        condition: service_completed_successfully
      submission-service:
        condition: service_started
    networks: [oj-net]

  # ---- exporters (sub-project 12) ---------------------------------------------
  # Prometheus scrapes each by service name (prometheus.yml, one job per service). Six serve /metrics over mutual TLS with
  # the leaf of their own tls subpath and accept any CA-signed client (Prometheus presents its own); each runs as its
  # image's own user, the owner pki/identities.txt gives that subpath. cAdvisor has no TLS: plain HTTP on oj-net. None
  # publishes a port.
  node-exporter:
    logging: *logging
    # The host: CPU, memory, filesystems (HostDiskAlmostFull). Host pid namespace and read-only views of /proc, /sys and /.
    image: prom/node-exporter:v1.12.1
    container_name: oj-node-exporter
    restart: unless-stopped
    pid: host
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/rootfs", "--web.config.file=/etc/oj/exporter-web.yml"]
    configs:
      - source: exporter-web
        target: /etc/oj/exporter-web.yml
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: node-exporter
    depends_on:
      tls-init:
        condition: service_completed_successfully
    mem_limit: 64m
    networks: [oj-net]

  cadvisor:
    logging: *logging
    # Per-container CPU and memory, named after the container (ContainerMemoryNearLimit). The host's Docker stores images
    # with the containerd snapshotter, which cAdvisor v0.52.1 cannot follow (no container is registered: it looks for the
    # removed /var/lib/docker/image/<driver>/layerdb), privileged or not. v0.60.6's Docker handler reads the containers
    # through containerd's API, hence containerd.sock (read-only, like docker.sock; either socket is root on the host).
    # Only cpu and memory are collected: the disk metrics walk every container's filesystem, and the kernel's dentry
    # cache they fill is charged to this container (measured 2026-10-20: 222 of its 256 MiB, 194 MiB of it slab; 15 MiB
    # with cpu and memory only).
    # Runs as root (the image's user) without privileged.
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: oj-cadvisor
    restart: unless-stopped
    command: ["--docker_only=true", "--store_container_labels=false", "--housekeeping_interval=15s", "--enable_metrics=cpu,memory"]
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 256m
    networks: [oj-net]

  # The three databases, each through the read-only role oj_monitor (pg_monitor; migrations/sp12-pg-monitor.sh creates it).
  # pg-hba admits it like every client: scram with PG_MONITOR_PASSWORD plus a CA-signed client certificate, verify-full.
  identity-db-exporter:
    logging: *logging
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: oj-identity-db-exporter
    restart: unless-stopped
    command: ["--web.config.file=/etc/oj/exporter-web.yml"]
    configs:
      - source: exporter-web
        target: /etc/oj/exporter-web.yml
    environment:
      DATA_SOURCE_URI: identity-db:5432/postgres?sslmode=verify-full&sslrootcert=/etc/oj/tls/ca.crt&sslcert=/etc/oj/tls/tls.crt&sslkey=/etc/oj/tls/tls.key
      DATA_SOURCE_USER: oj_monitor
      DATA_SOURCE_PASS: ${PG_MONITOR_PASSWORD:?run migrations/sp12-env.sh}
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: identity-db-exporter
    depends_on:
      tls-init:
        condition: service_completed_successfully
      identity-db:
        condition: service_healthy
    mem_limit: 64m
    networks: [oj-net]

  problem-db-exporter:
    logging: *logging
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: oj-problem-db-exporter
    restart: unless-stopped
    command: ["--web.config.file=/etc/oj/exporter-web.yml"]
    configs:
      - source: exporter-web
        target: /etc/oj/exporter-web.yml
    environment:
      DATA_SOURCE_URI: problem-db:5432/postgres?sslmode=verify-full&sslrootcert=/etc/oj/tls/ca.crt&sslcert=/etc/oj/tls/tls.crt&sslkey=/etc/oj/tls/tls.key
      DATA_SOURCE_USER: oj_monitor
      DATA_SOURCE_PASS: ${PG_MONITOR_PASSWORD:?run migrations/sp12-env.sh}
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: problem-db-exporter
    depends_on:
      tls-init:
        condition: service_completed_successfully
      problem-db:
        condition: service_healthy
    mem_limit: 64m
    networks: [oj-net]

  submission-db-exporter:
    logging: *logging
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: oj-submission-db-exporter
    restart: unless-stopped
    command: ["--web.config.file=/etc/oj/exporter-web.yml"]
    configs:
      - source: exporter-web
        target: /etc/oj/exporter-web.yml
    environment:
      DATA_SOURCE_URI: submission-db:5432/postgres?sslmode=verify-full&sslrootcert=/etc/oj/tls/ca.crt&sslcert=/etc/oj/tls/tls.crt&sslkey=/etc/oj/tls/tls.key
      DATA_SOURCE_USER: oj_monitor
      DATA_SOURCE_PASS: ${PG_MONITOR_PASSWORD:?run migrations/sp12-env.sh}
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: submission-db-exporter
    depends_on:
      tls-init:
        condition: service_completed_successfully
      submission-db:
        condition: service_healthy
    mem_limit: 64m
    networks: [oj-net]

  redis-exporter:
    logging: *logging
    # Redis over TLS with its own client certificate (Redis requires one); /metrics over mutual TLS (-tls-server-*).
    image: oliver006/redis_exporter:v1.94.0
    container_name: oj-redis-exporter
    restart: unless-stopped
    command: ["-redis.addr=rediss://redis:6379", "-tls-ca-cert-file=/etc/oj/tls/ca.crt", "-tls-client-cert-file=/etc/oj/tls/tls.crt", "-tls-client-key-file=/etc/oj/tls/tls.key", "-tls-server-cert-file=/etc/oj/tls/tls.crt", "-tls-server-key-file=/etc/oj/tls/tls.key", "-tls-server-ca-cert-file=/etc/oj/tls/ca.crt"]
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: redis-exporter
    depends_on:
      tls-init:
        condition: service_completed_successfully
    mem_limit: 64m
    networks: [oj-net]

  kafka-exporter:
    logging: *logging
    # Topic offsets and consumer-group lag (ConsumerLagHigh) through kafka:29092 over TLS as CN kafka-exporter, which
    # kafka/acls.sh lets describe every topic and group and the cluster; /metrics over mutual TLS (--server.tls.*). It
    # exits when Kafka cannot be reached, so it starts after kafka-init and restarts until Kafka is back.
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: oj-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:29092", "--tls.enabled", "--tls.server-name=kafka", "--tls.ca-file=/etc/oj/tls/ca.crt", "--tls.cert-file=/etc/oj/tls/tls.crt", "--tls.key-file=/etc/oj/tls/tls.key", "--server.tls.enabled", "--server.tls.mutual-auth-enabled", "--server.tls.ca-file=/etc/oj/tls/ca.crt", "--server.tls.cert-file=/etc/oj/tls/tls.crt", "--server.tls.key-file=/etc/oj/tls/tls.key"]
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: kafka-exporter
    depends_on:
      tls-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 64m
    networks: [oj-net]

  # ---- alerting (sub-project 12) ----------------------------------------------
  # Prometheus (prometheus.yml `alerting:`) sends every firing alert here. The UI and the silences are on loopback
  # (plain HTTP, like the other operator UIs). Telegram is added by alertmanager/render.sh only when .env has both
  # ALERT_TELEGRAM_* variables; the rendered config and the token file live in the container's /tmp, never on the host.
  alertmanager:
    logging: *logging
    image: prom/alertmanager:v0.34.1
    container_name: oj-alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/render.sh"]
    environment:
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanagerdata:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"   # ops UI and silences, loopback only
    mem_limit: 64m
    networks: [oj-net]

  # ---- dashboards (sub-project 12) --------------------------------------------
  # Grafana on loopback (plain HTTP, like the other operator UIs). The datasource and the three dashboards are provisioned
  # read-only from ./grafana; there is no Jaeger datasource (README: Jaeger 2.21 dropped the v1 HTTP API it calls).
  # GF_SECURITY_ADMIN_PASSWORD only applies when the grafanadata volume is first created (README). The image's own user
  # (472) writes /var/lib/grafana. Plugin preinstall is off: it downloads from the internet at start and costs memory.
  grafana:
    logging: *logging
    image: grafana/grafana-oss:13.0.2
    container_name: oj-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run migrations/sp12-env.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # operator UI, loopback only
    mem_limit: 256m
    networks: [oj-net]

  # ---- application services -------------------------------------------------
  # Submissions, judging, languages and judge servers: the remainder of the judge-api monolith, its own service
  # with its own database since sub-project 3b.
  submission-service:
    image: ${OJ_REGISTRY:-ghcr.io/my-online-judge}/oj-submission-service:${OJ_SUBMISSION_TAG:-${OJ_TAG:-main}}
    logging: *logging
    configs: *jvm-dns-configs
    build:
      context: ../oj-submission-service
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-submission-service
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
      submission-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Deliberately not problem-service: submission-service starts without it, answers 503 for submissions while
      # it is away (circuit breaker), and keeps judging what is already queued.
    # submission-db credentials and the profile from .env.submission; from the shared .env only what this service
    # needs — deliberately not env_file .env.
    env_file:
      - .env.submission
    environment:
      <<: [*tz-env, *otel-env]
      SPRING_PROFILES_INCLUDE: tls
      OTEL_SERVICE_NAME: submission-service
      JAVA_TOOL_OPTIONS: *java-tool-options
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JUDGE_SERVER_TOKEN: ${JUDGE_SERVER_TOKEN}
      # problem-service's internal gRPC API, over mutual TLS: this service's certificate is its credential, and the
      # name is what problem-service's certificate is verified against.
      PROBLEM_GRPC_ADDRESS: static://problem-service:9090
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: submission-service
    mem_limit: 1g
    # No host port: the API is public only through api-gateway; judge-worker posts the sandboxes' heartbeats to
    # submission-service:8000 (mutual TLS, as judge-worker); Prometheus scrapes the actuator on 8081.
    healthcheck:
      # Mutual TLS with the service's own certificate (curl: busybox wget cannot present one).
      test: ["CMD-SHELL", "curl -fsS --cacert /etc/oj/tls/ca.crt --cert /etc/oj/tls/tls.crt --key /etc/oj/tls/tls.key https://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [oj-net]

  identity-service:
    image: ${OJ_REGISTRY:-ghcr.io/my-online-judge}/oj-identity-service:${OJ_IDENTITY_TAG:-${OJ_TAG:-main}}
    logging: *logging
    configs: *jvm-dns-configs
    build:
      context: ../oj-identity-service
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-identity-service
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*tz-env, *otel-env]
      SPRING_PROFILES_INCLUDE: tls
      OTEL_SERVICE_NAME: identity-service
      JAVA_TOOL_OPTIONS: *java-tool-options
      # Browsers reach the API only over https (the edge): the auth cookies carry Secure (and always SameSite=Lax).
      APP_COOKIE_SECURE: "true"
    # JWT signing keys, Google OAuth, identity-db credentials — only the identity containers read it.
    env_file:
      - .env.identity
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: identity-service
    mem_limit: 768m
    # No host port: public only through api-gateway (/api/v1/{auth,users,roles,permissions,security}/**).
    # The other services fetch the token-signing key from https://identity-service:8000/.well-known/jwks.json.
    healthcheck:
      # Mutual TLS with the service's own certificate (curl: busybox wget cannot present one).
      test: ["CMD-SHELL", "curl -fsS --cacert /etc/oj/tls/ca.crt --cert /etc/oj/tls/tls.crt --key /etc/oj/tls/tls.key https://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [oj-net]

  problem-service:
    image: ${OJ_REGISTRY:-ghcr.io/my-online-judge}/oj-problem-service:${OJ_PROBLEM_TAG:-${OJ_TAG:-main}}
    logging: *logging
    configs: *jvm-dns-configs
    build:
      context: ../oj-problem-service
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-problem-service
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
      problem-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Not identity-service: the token-signing key is fetched lazily, on the first request with a token.
    # problem-db credentials from .env.problem; from the shared .env only what problem-service needs —
    # deliberately not env_file .env, which carries the judge-server token and the other services' settings.
    env_file:
      - .env.problem
    environment:
      <<: [*tz-env, *otel-env]
      SPRING_PROFILES_INCLUDE: tls
      OTEL_SERVICE_NAME: problem-service
      JAVA_TOOL_OPTIONS: *java-tool-options
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      # MinIO over TLS (the tls profile's minio.ssl-bundle), with problem-service's own key: read, write and delete in
      # the test-case bucket only (minio/policies/problem-rw.json).
      MINIO_ENDPOINT: https://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_PROBLEM_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_PROBLEM_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: problem-service
    mem_limit: 1g
    # No host port: the API is public only through api-gateway (/api/v1/problems/**); submission-service calls the
    # internal gRPC API on problem-service:9090 (mutual TLS, only the CN submission-service is allowed); Prometheus
    # scrapes the actuator on 8081.
    healthcheck:
      # Mutual TLS with the service's own certificate (curl: busybox wget cannot present one).
      test: ["CMD-SHELL", "curl -fsS --cacert /etc/oj/tls/ca.crt --cert /etc/oj/tls/tls.crt --key /etc/oj/tls/tls.key https://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [oj-net]

  api-gateway:
    image: ${OJ_REGISTRY:-ghcr.io/my-online-judge}/oj-api-gateway:${OJ_GATEWAY_TAG:-${OJ_TAG:-main}}
    logging: *logging
    configs: *jvm-dns-configs
    build:
      context: ../oj-api-gateway
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-api-gateway
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
      # Started, not healthy: a back-end that is down answers 503 through the gateway, and the other routes keep
      # working — the gateway itself must not wait for every service. Redis is needed from the first request.
      submission-service:
        condition: service_started
      identity-service:
        condition: service_started
      problem-service:
        condition: service_started
      redis:
        condition: service_healthy
    # Only what the gateway needs — deliberately NOT env_file .env, which carries DB, JWT and OAuth secrets.
    environment:
      <<: [*tz-env, *otel-env]
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_PROFILES_INCLUDE: tls
      # Mutual TLS: the gateway presents its certificate (api-gateway subpath) and verifies each service's.
      SUBMISSION_URI: https://submission-service:8000
      IDENTITY_URI: https://identity-service:8000
      PROBLEM_URI: https://problem-service:8000
      OTEL_SERVICE_NAME: api-gateway
      JAVA_TOOL_OPTIONS: *java-tool-options
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # The browsers' origin, https://${OJ_PUBLIC_HOST}, is a CORS origin the gateway allows (application-tls.yml).
      OJ_PUBLIC_HOST: ${OJ_PUBLIC_HOST:-localhost}
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: api-gateway
    mem_limit: 512m
    # No host port: the API (8000) serves TLS inside oj-net and answers only the edge's certificate (tls profile), so
    # browsers reach it as https://${OJ_PUBLIC_HOST}/api/ through the edge; the actuator (8081) stays inside oj-net.
    healthcheck:
      # Mutual TLS with the gateway's own certificate (curl: busybox wget cannot present one).
      test: ["CMD-SHELL", "curl -fsS --cacert /etc/oj/tls/ca.crt --cert /etc/oj/tls/tls.crt --key /etc/oj/tls/tls.key https://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [oj-net]

  jaeger:
    logging: *logging
    image: jaegertracing/jaeger:2.21.0
    container_name: oj-jaeger
    restart: unless-stopped
    environment: *tz-env
    # Upstream's all-in-one config with OTLP over mutual TLS and OTLP as the only ingest (tests/jaeger-config.test.sh).
    command: ["--config", "file:/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      # The OTLP receivers' certificate, and the CA the clients' certificates must chain to.
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: jaeger
    depends_on:
      tls-init:
        condition: service_completed_successfully
    # OTLP receivers (4317 gRPC, 4318 HTTP; TLS, a client certificate from the CA required) stay inside oj-net.
    # 16686 = UI + query API (/api/v3), plain HTTP, loopback only; storage is in-memory (at most 100000 traces), so
    # traces are lost on restart.
    ports:
      - "127.0.0.1:16686:16686"
    networks: [oj-net]

  # One-shot: the worker runs as uid 10001 and the named volume test_case_cache is created root-owned, so hand it over
  # before the worker starts (Docker copies image content into a new volume only for the image's own directories).
  # The owner only: compose runs this again on every `up` of the worker, and a checker bundle's directory and inputs
  # keep group 12003 (judge-worker below).
  volume-init:
    logging: *logging
    image: alpine:3.22
    restart: "no"
    network_mode: none
    volumes:
      - test_case_cache:/test_case
    entrypoint: ["/bin/sh", "-c", "chown -R 10001 /test_case"]

  judge-worker:
    image: ${OJ_REGISTRY:-ghcr.io/my-online-judge}/judge-worker:${OJ_WORKER_TAG:-${OJ_TAG:-main}}
    logging: *logging
    build: ../judge-worker
    # No fixed container_name: judge-workers form a Kafka consumer group (group_id=judge-workers)
    # and are meant to scale horizontally — `docker compose up -d --scale judge-worker=3` spreads
    # the 6 submission.requested partitions across the instances. A fixed name would block scaling.
    restart: unless-stopped
    # Group 12003 is qduoj's spj, the user that runs a problem's checker. The worker gives a checker bundle's directory
    # and inputs to that group (0750, 0640), so the checker reads them and a submission (code, 12002) does not; the
    # expected outputs stay the worker's (0600), and a bundle without a checker stays 0700.
    group_add: ["12003"]
    volumes:
      - test_case_cache:/test_case
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: judge-worker
    depends_on:
      tls-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
      # Now that the sandbox healthcheck reflects reality (see x-sandbox-health), wait for it:
      # a worker that starts first burns its retries dispatching to a sandbox still booting.
      judge-server:
        condition: service_healthy
      judge-server-2:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Only what the worker reads — not env_file .env, which also carries MinIO's root account and the other
    # services' keys.
    environment:
      <<: [*tz-env, *otel-env]
      OTEL_SERVICE_NAME: judge-worker
      # The worker's certificate (judge-worker subpath, mounted above): Kafka over TLS, the heartbeat to
      # submission-service over mutual TLS, and /metrics on 9100 over HTTPS for clients with a CA-signed certificate.
      OJ_TLS_DIR: /etc/oj/tls
      JUDGE_SERVER_TOKEN: ${JUDGE_SERVER_TOKEN}
      # Both sandboxes, round-robin with failover, over mutual TLS (the worker's certificate; the names are the sandboxes'
      # SANs). A third sandbox: add a service like judge-server-2, its id to pki/identities.txt, and its URL here.
      JUDGE_SERVER_URL: https://judge-server:8080,https://judge-server-2:8080
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      # MinIO over TLS (verified against the CA, tls.minio_http_client), with the worker's own key: read-only in the
      # test-case bucket (minio/policies/worker-ro.json).
      MINIO_ENDPOINT: https://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # The sandboxes cannot reach submission-service, so the worker relays their /ping there.
      SANDBOX_HEARTBEAT_URL: https://submission-service:8000/api/judge_server_heartbeat/
    # oj-net for Kafka/MinIO/the registry, sandbox-net for the sandboxes — the only service on both.
    networks: [oj-net, sandbox-net]

  run-worker:
    # The Run lane (docs/superpowers/specs/2026-10-24-run-code-design.md §9): the judge-worker image on its own topics
    # and consumer group, so runs never queue behind submissions and submissions never behind runs. A run carries its
    # cases inline: no bundle cache, no MinIO credentials, no heartbeat relay (the submit workers report the sandboxes).
    # Its own certificate identity (run-worker): Kafka lets it read run.requested and write run.judged, nothing of the
    # submit lane. Like judge-worker it has no fixed container name and scales (`--scale run-worker=N`).
    image: ${OJ_REGISTRY:-ghcr.io/my-online-judge}/judge-worker:${OJ_WORKER_TAG:-${OJ_TAG:-main}}
    logging: *logging
    build: ../judge-worker
    restart: unless-stopped
    deploy:
      # One replica judges one run at a time (the sandbox runs a run's cases in parallel, not runs): two answer about
      # 20-40 runs inside submission-service's 45 s wait, which its in-flight cap (RUN_MAX_INFLIGHT, 20) assumes.
      replicas: 2
    volumes:
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: run-worker
    depends_on:
      tls-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      judge-server:
        condition: service_healthy
      judge-server-2:
        condition: service_healthy
    environment:
      <<: [*tz-env, *otel-env]
      OTEL_SERVICE_NAME: run-worker
      OJ_TLS_DIR: /etc/oj/tls
      JUDGE_SERVER_TOKEN: ${JUDGE_SERVER_TOKEN}
      JUDGE_SERVER_URL: https://judge-server:8080,https://judge-server-2:8080
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REQUESTED_TOPIC: run.requested
      JUDGED_TOPIC: run.judged
      CONSUMER_GROUP: run-workers
      # A run's caller waits 45 s: retrying a sandbox outage for the worker's default 5 minutes would judge for nobody.
      JUDGE_INFRA_RETRY_SECONDS: "30"
    networks: [oj-net, sandbox-net]

  judge-server:
    # Official QingdaoU sandbox on Docker Hub (qduoj account) — the canonical
    # registry.cn-hangzhou.aliyuncs.com/onlinejudge/judge_server is unreachable outside China.
    # Overridden by docker-compose.mock.yml for offline runs.
    <<: *sandbox
    container_name: oj-judge-server
    # The registry is keyed by hostname; without a fixed one every recreate added a row (18 by 2026-10-05).
    hostname: judge-server
    # Map form (not list) so docker-compose.mock.yml can override image
    # while inheriting these values via Compose's environment merge.
    environment:
      <<: *sandbox-env
      SERVICE_URL: https://judge-server:8080
    volumes:
      - test_case_cache:/test_case:ro
      - js1log:/log
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: judge-server

  judge-server-2:
    # Second QingdaoU sandbox. The worker round-robins across the JUDGE_SERVER_URL comma-list with
    # failover (T1-3), so a second sandbox adds judging throughput and survives one sandbox dying.
    # Each sandbox needs its OWN writable /log (they can't share one), hence a dedicated volume.
    <<: *sandbox
    container_name: oj-judge-server-2
    hostname: judge-server-2
    environment:
      <<: *sandbox-env
      SERVICE_URL: https://judge-server-2:8080
    volumes:
      - test_case_cache:/test_case:ro
      - js2log:/log
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: judge-server-2

  judge-portal:
    image: ${OJ_REGISTRY:-ghcr.io/my-online-judge}/judge-portal:${OJ_PORTAL_TAG:-${OJ_TAG:-main}}
    logging: *logging
    build:
      context: ../judge-portal
      args:
        # Relative: the portal and the API share the edge's origin.
        VITE_API_BASE_URL: /api/v1
    container_name: oj-judge-portal
    restart: unless-stopped
    environment: *tz-env
    depends_on:
      tls-init:
        condition: service_completed_successfully
      api-gateway:
        condition: service_started
    # No host port: HTTPS on 443 inside oj-net with the judge-portal certificate, for the edge's certificate only.
    volumes:
      - ./portal/nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: judge-portal
    networks: [oj-net]

  # ---- the HTTPS edge (sub-project 10) ----------------------------------------
  # The only service on public host ports. edge/Caddyfile: one origin, /api/* to api-gateway:8000 and the rest to
  # judge-portal:443, both over mutual TLS with the edge certificate; http on 80 redirects to https. The site
  # certificate is the edge leaf (its SAN carries OJ_PUBLIC_HOST, pki/identities.txt), signed by the private CA.
  edge:
    logging: *logging
    image: caddy:2.11.7-alpine
    container_name: oj-edge
    restart: unless-stopped
    environment:
      <<: *tz-env
      OJ_PUBLIC_HOST: ${OJ_PUBLIC_HOST:-localhost}
    depends_on:
      tls-init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - type: volume
        source: tls
        target: /etc/oj/tls
        read_only: true
        volume:
          subpath: edge
    mem_limit: 128m
    healthcheck:
      # Caddy's admin API (127.0.0.1:2019 inside the container, on by default) answers once a config is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [oj-net]

configs:
  # Postgres admits TLS connections only, and only with a client certificate signed by our CA (the CA file is
  # ssl_ca_file). `local` stays trust for the in-container healthcheck and the image's init scripts.
  # Keep identical to oj-identity-service/src/test/resources/tls/pg_hba.conf (PostgresClientCertTest runs these rules).
  pg-hba:
    content: |
      local   all all                     trust
      hostssl all all 0.0.0.0/0           scram-sha-256 clientcert=verify-ca
      hostssl all all ::/0                scram-sha-256 clientcert=verify-ca
  jvm-dns-security:
    # Appended to each JVM's java.security (x-java-tool-options): DNS answers kept 1 s, failed lookups not at all.
    content: |
      networkaddress.cache.ttl=1
      networkaddress.cache.negative.ttl=0
  exporter-web:
    # The Prometheus exporter toolkit's web config (node-exporter, the postgres-exporters: --web.config.file): /metrics
    # over TLS with the leaf of the exporter's own tls subpath, and only for a client certificate signed by the CA.
    content: |
      tls_server_config:
        cert_file: /etc/oj/tls/tls.crt
        key_file: /etc/oj/tls/tls.key
        client_ca_file: /etc/oj/tls/ca.crt
        client_auth_type: RequireAndVerifyClientCert

networks:
  oj-net:
    name: oj-net
  # The sandboxes and judge-worker only. internal: no route off the host either.
  sandbox-net:
    name: oj-sandbox-net
    internal: true

volumes:
  identitydata:
  problemdata:
  submissiondata:
  redisdata:
  js1log:
  js2log:
  miniodata:
  test_case_cache:
  promdata:
  alertmanagerdata:
  grafanadata:
  kafkadata:
  tls:
  caddydata:
