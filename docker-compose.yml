# Authoritative Online Judge stack — the single source of truth for deploying every service.
# Build contexts point back at the sibling repos; only configuration lives here.
#
#   cd judge-deployment
#   docker compose up -d --build                                          # real qduoj sandbox
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d # mock sandbox
#
# Config is centralized in ./.env (loaded automatically by Compose); identity-db and identity-service
# read ./.env.identity instead, which alone holds the JWT signing keys and the Google OAuth secret;
# problem-db and problem-service read ./.env.problem (migrations/sp2-env.sh creates it), submission-db and
# submission-service ./.env.submission (migrations/sp3-env.sh create).

# Vietnam time (GMT+7) for every service's logs and DB now()/timestamps, aliased into each service
# below. Sandboxes (judge-server, judge-server-2) are intentionally excluded — they run untrusted
# submissions and their wall-clock is irrelevant. NOTE: every Spring service also pins the JVM zone in code
# (its *Application.main) — that is what fixes its stored LocalDateTime timestamps; the TZ
# here only aligns its logs. TZ is best-effort on images without OS tzdata (alpine) — harmless if unset.
x-tz-env: &tz-env
  TZ: Asia/Ho_Chi_Minh

# OpenTelemetry export for every traced service (Java agent + judge-worker SDK). Jaeger is optional:
# exporters drop spans when it is unreachable, they never block a request or a judge.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

# Liveness for the QingdaoU sandboxes, shared by both instances.
#
# The image ships `python3 /code/service.py` as its HEALTHCHECK — QingdaoU's heartbeat, which POSTs
# to BACKEND_URL /api/judge_server_heartbeat/. This stack dispatches over Kafka and never implements
# that endpoint, so both sandboxes reported (unhealthy) forever while judging perfectly: a permanently
# red signal that trains you to ignore it. Ask the sandbox itself instead — /ping is its own liveness
# endpoint and returns live cpu/memory/judger_version. Auth is sha256(TOKEN) in X-Judge-Server-Token,
# computed inline because the sandbox stores the digest, not the raw token.
# Overridden in docker-compose.mock.yml: the mock only implements /judge.
x-sandbox-health: &sandbox-health
  test:
    - CMD
    - python3
    - -c
    - 'import hashlib,os,urllib.request as u; t=hashlib.sha256(os.environ["TOKEN"].encode()).hexdigest(); u.urlopen(u.Request("http://localhost:8080/ping",data=b"{}",headers={"X-Judge-Server-Token":t,"Content-Type":"application/json"}),timeout=3)'
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  # ---- infrastructure ------------------------------------------------------
  identity-db:
    image: postgres:16
    container_name: oj-identity-db
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh", "-c", "log_timezone=Asia/Ho_Chi_Minh"]
    environment:
      <<: *tz-env
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD. Nothing outside the identity containers reads it.
    env_file:
      - .env.identity
    # No host port. Schema: identity-service's Flyway (V1 schema, V2 seed) on first boot.
    volumes:
      - identitydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [oj-net]

  problem-db:
    image: postgres:16
    container_name: oj-problem-db
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh", "-c", "log_timezone=Asia/Ho_Chi_Minh"]
    environment:
      <<: *tz-env
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD. Nothing outside the problem containers reads it.
    env_file:
      - .env.problem
    # No host port. Schema: problem-service's Flyway (V1 the problem tables, V2 statistics) on first boot.
    volumes:
      - problemdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [oj-net]

  submission-db:
    image: postgres:16
    container_name: oj-submission-db
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh", "-c", "log_timezone=Asia/Ho_Chi_Minh"]
    environment:
      <<: *tz-env
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD. Nothing outside the submission containers reads it.
    env_file:
      - .env.submission
    # No host port. Schema: oj-submission-service's Flyway (V1 the submission tables, V2 the languages), applied by
    # migrations/sp3-flyway.sh before the service first starts.
    volumes:
      - submissiondata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [oj-net]

  kafka:
    # 3.9.0's image ships a broken /bin/bash (readline relocation errors) that makes the
    # entrypoint exit 127 on this host. 3.8.1 has a working bash and identical env convention.
    image: apache/kafka:3.8.1
    container_name: oj-kafka
    restart: unless-stopped
    # Host publish of the EXTERNAL listener is intentionally disabled: all services reach
    # Kafka over the in-network INTERNAL listener (kafka:29092), so the host port is only
    # for external debugging tools. Re-enable once nothing else on the host owns 9092.
    # ports:
    #   - "9092:9092"
    environment:
      <<: *tz-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # judge-worker subscribes to submission.requested before submission-service declares it; an auto-created
      # topic must then get the declared 6 partitions, or the worker only sees the extra ones after its 5-minute
      # metadata refresh (submissions sat PENDING). With the volume below an empty broker is a first start only.
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      # Topics, messages and committed offsets live on the named volume and survive a recreated container.
      # The cluster id is fixed because the formatted volume records it: a different id refuses to start.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: LL99FafWSZyhNAgsibWLog
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [oj-net]

  redis:
    # Verdict SSE fan-out across submission-service instances (pub/sub on channel oj.verdicts).
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    environment: *tz-env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [oj-net]

  minio:
    # S3-compatible object storage: single source of truth for problem test cases (T3-8).
    # Pinned for reproducibility — this is the release the T3-8 stack was verified against. MinIO no longer
    # publishes images (Docker Hub and quay.io are empty), so this is the org's byte-identical mirror of
    # minio/minio:RELEASE.2025-09-07T16-13-09Z; source: github.com/minio/minio at that tag (AGPL-3.0).
    image: ghcr.io/my-online-judge/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: oj-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      <<: *tz-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [oj-net]

  prometheus:
    # Scrapes every service's /actuator/prometheus (prometheus.yml). Pinned for reproducibility.
    image: prom/prometheus:v3.1.0
    container_name: oj-prometheus
    restart: unless-stopped
    environment: *tz-env
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # ops UI, loopback only
    depends_on:
      submission-service:
        condition: service_started
    networks: [oj-net]

  # ---- application services -------------------------------------------------
  # Submissions, judging, languages and judge servers: the remainder of the judge-api monolith, its own service
  # with its own database since sub-project 3b.
  submission-service:
    build:
      context: ../oj-submission-service
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-submission-service
    restart: unless-stopped
    depends_on:
      submission-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately not problem-service: submission-service starts without it, answers 503 for submissions while
      # it is away (circuit breaker), and keeps judging what is already queued.
    # submission-db credentials and the profile from .env.submission; from the shared .env only what this service
    # needs — deliberately not env_file .env.
    env_file:
      - .env.submission
    environment:
      <<: [*tz-env, *otel-env]
      OTEL_SERVICE_NAME: submission-service
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=75
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JUDGE_SERVER_TOKEN: ${JUDGE_SERVER_TOKEN}
      OJ_JWKS_URI: http://identity-service:8000/.well-known/jwks.json
      # problem-service's internal gRPC API and the service token it checks.
      PROBLEM_GRPC_ADDRESS: static://problem-service:9090
      PROBLEM_RPC_TOKEN: ${PROBLEM_RPC_TOKEN:-}
    mem_limit: 1g
    # No host port: the API is public only through api-gateway; the sandboxes reach submission-service:8000 for
    # heartbeats inside oj-net; Prometheus scrapes the actuator on 8081.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [oj-net]

  identity-service:
    build:
      context: ../oj-identity-service
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-identity-service
    restart: unless-stopped
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*tz-env, *otel-env]
      OTEL_SERVICE_NAME: identity-service
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=75
    # JWT signing keys, Google OAuth, identity-db credentials — only the identity containers read it.
    env_file:
      - .env.identity
    mem_limit: 768m
    # No host port: public only through api-gateway (/api/v1/{auth,users,roles,permissions,security}/**).
    # The other services fetch the token-signing key from identity-service:8000/.well-known/jwks.json.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [oj-net]

  problem-service:
    build:
      context: ../oj-problem-service
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-problem-service
    restart: unless-stopped
    depends_on:
      problem-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Not identity-service: the token-signing key is fetched lazily, on the first request with a token.
    # problem-db credentials from .env.problem; from the shared .env only what problem-service needs —
    # deliberately not env_file .env, which carries the judge-server token and the other services' settings.
    env_file:
      - .env.problem
    environment:
      <<: [*tz-env, *otel-env]
      OTEL_SERVICE_NAME: problem-service
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=75
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      OJ_JWKS_URI: http://identity-service:8000/.well-known/jwks.json
      # Checked on every internal gRPC call; the service refuses to start without it (32+ characters).
      PROBLEM_RPC_TOKEN: ${PROBLEM_RPC_TOKEN:-}
    mem_limit: 768m
    # No host port: the API is public only through api-gateway (/api/v1/problems/**); submission-service calls the
    # internal gRPC API on problem-service:9090; Prometheus scrapes the actuator on 8081.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [oj-net]

  api-gateway:
    build:
      context: ../oj-api-gateway
      additional_contexts:
        oj-common: ../oj-common
    container_name: oj-api-gateway
    restart: unless-stopped
    depends_on:
      # Started, not healthy: a back-end that is down answers 503 through the gateway, and the other routes keep
      # working — the gateway itself must not wait for every service. Redis is needed from the first request.
      submission-service:
        condition: service_started
      identity-service:
        condition: service_started
      problem-service:
        condition: service_started
      redis:
        condition: service_healthy
    # Only what the gateway needs — deliberately NOT env_file .env, which carries DB, JWT and OAuth secrets.
    environment:
      <<: [*tz-env, *otel-env]
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SUBMISSION_URI: http://submission-service:8000
      IDENTITY_URI: http://identity-service:8000
      PROBLEM_URI: http://problem-service:8000
      OTEL_SERVICE_NAME: api-gateway
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=75
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    mem_limit: 512m
    ports:
      # The only public API port; actuator (8081) stays inside oj-net. Must stay 8000: judge-portal
      # is built against VITE_API_BASE_URL=http://localhost:8000/api/v1.
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [oj-net]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: oj-jaeger
    restart: unless-stopped
    environment: *tz-env
    # OTLP receivers (4317 gRPC, 4318 HTTP) stay inside oj-net. 16686 = UI + query API (/api/v3),
    # loopback only; storage is in-memory, so traces are lost on restart.
    ports:
      - "127.0.0.1:16686:16686"
    networks: [oj-net]

  judge-worker:
    build: ../judge-worker
    # No fixed container_name: judge-workers form a Kafka consumer group (group_id=judge-workers)
    # and are meant to scale horizontally — `docker compose up -d --scale judge-worker=3` spreads
    # the 6 submission.requested partitions across the instances. A fixed name would block scaling.
    restart: unless-stopped
    volumes:
      - test_case_cache:/test_case
    depends_on:
      kafka:
        condition: service_healthy
      # Now that the sandbox healthcheck reflects reality (see x-sandbox-health), wait for it:
      # a worker that starts first burns its retries dispatching to a sandbox still booting.
      judge-server:
        condition: service_healthy
      judge-server-2:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Only what the worker reads — not env_file .env, which also carries MinIO's root account and the
    # service token of problem-service's internal API.
    environment:
      <<: [*tz-env, *otel-env]
      OTEL_SERVICE_NAME: judge-worker
      JUDGE_SERVER_TOKEN: ${JUDGE_SERVER_TOKEN}
      JUDGE_SERVER_URL: ${JUDGE_SERVER_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks: [oj-net]

  judge-server:
    # Official QingdaoU sandbox on Docker Hub (qduoj account) — the canonical
    # registry.cn-hangzhou.aliyuncs.com/onlinejudge/judge_server is unreachable outside China.
    # Overridden by docker-compose.mock.yml for offline / non-privileged runs.
    image: qduoj/judge-server
    container_name: oj-judge-server
    restart: always
    privileged: true
    shm_size: 256m
    # Map form (not list) so docker-compose.mock.yml can override image/privileged
    # while inheriting these values via Compose's environment merge.
    environment:
      TOKEN: ${JUDGE_SERVER_TOKEN}
      SERVICE_URL: http://judge-server:8080
      BACKEND_URL: http://submission-service:8000/api/judge_server_heartbeat/
    volumes:
      - test_case_cache:/test_case:ro
      - ../judge-server/log:/log
    healthcheck: *sandbox-health
    networks: [oj-net]

  judge-server-2:
    # Second QingdaoU sandbox. The worker round-robins across the JUDGE_SERVER_URL comma-list with
    # failover (T1-3), so a second sandbox adds judging throughput and survives one sandbox dying.
    # Each sandbox needs its OWN writable /log (they can't share one), hence a dedicated volume.
    image: qduoj/judge-server
    container_name: oj-judge-server-2
    restart: always
    privileged: true
    shm_size: 256m
    environment:
      TOKEN: ${JUDGE_SERVER_TOKEN}
      SERVICE_URL: http://judge-server-2:8080
      BACKEND_URL: http://submission-service:8000/api/judge_server_heartbeat/
    volumes:
      - test_case_cache:/test_case:ro
      - js2log:/log
    healthcheck: *sandbox-health
    networks: [oj-net]

  judge-portal:
    build: ../judge-portal
    container_name: oj-judge-portal
    restart: unless-stopped
    environment: *tz-env
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "80:80"
    networks: [oj-net]

networks:
  oj-net:
    name: oj-net

volumes:
  # The retired oj-db's data (sub-project 3b). No service mounts it any more; it is kept until you delete it by
  # hand (docker volume rm judge-deployment_pgdata) — the final backup is in backups/.
  pgdata:
  identitydata:
  problemdata:
  submissiondata:
  js2log:
  miniodata:
  test_case_cache:
  promdata:
  kafkadata:
